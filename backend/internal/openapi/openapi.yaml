  /api/v1/complexes/{id}/reports/monthly:
    get:
      tags: [reporting]
      operationId: reportingGetMonthlyReport
      summary: Monthly payments report
      description: >-
        Defaults to the current month and year in the Argentina timezone. Period validation
        errors answer `400` with the bare machine code string as the `error` value (not an
        object), unlike the field-validation convention used elsewhere in the API.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: month
          in: query
          schema: {type: integer, minimum: 1, maximum: 12}
        - name: year
          in: query
          schema: {type: integer}
