openapi: 3.1.0

info:
  title: Vibe API
  version: "1.0.0"
  description: |
    Vibe is a multi-tenant SaaS backend for padel and racket-sports court management: venue
    profiles, court and price configuration, bookings, payments, staff accounts and a public
    storefront per venue.

    Authentication is cookie based. A successful login or registration flow sets an HttpOnly
    `access_token` cookie (a 15 minute JWT) and an HttpOnly `refresh_token` cookie (a 30 day
    opaque token, scoped to `/api/v1/auth`). Every request that changes state and carries a
    session must also send the `X-CSRF-Token` header, whose value is returned in the JSON body
    of a successful login or refresh call. Public endpoints that create a session
    (register, login, refresh, logout, verify-email, resend-verification, forgot-password,
    reset-password) and the two webhook endpoints are exempt from the CSRF check because they
    either establish the session or authenticate by a provider signature instead of a cookie.

    Every request that carries a JSON body must send `Content-Type: application/json` (a
    `; charset=utf-8` parameter is accepted); any other value, or none at all, answers
    `415 Unsupported Media Type` before the body is read. This is enforced even on the routes
    above that are exempt from the CSRF check, since those are exactly the ones a cross-site
    `<form enctype="text/plain">` submission could otherwise drive with a forged body.

    Every JSON error response uses the envelope `{"error": <message>}`. Validation failures
    answer `422 Unprocessable Entity` with `error` as an object mapping field name to message
    or to one of the stable machine codes documented per field. Every other error status uses a
    plain string message. Paginated list endpoints share one cursor convention: an opaque
    `cursor` query parameter and a `limit` query parameter (default 50, maximum 200), with the
    response envelope carrying a `metadata` object (`next_cursor`, `has_more`, `total_count`).

    This document excludes the `/debug/vars` and `/debug/pprof/*` routes. They are stdlib
    introspection endpoints registered only when the server runs with `ENV=development` (and,
    for pprof, the `-pprof` flag), never part of the product API surface, and answer in
    non-JSON, tool-specific formats that do not fit an OpenAPI schema.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: https://api.vibe.com.ar
    description: Production (placeholder domain)
  - url: http://localhost:8080
    description: Local development

tags:
  - name: admin
    description: Platform-operator views. Cross-tenant, superadmin only. Every read is itself recorded to the audit trail.
  - name: audit
    description: The tenant-facing mirror of a complex's own audit trail.
  - name: auth
    description: Registration, session cookies, email verification, password reset and account self-service.
  - name: bookings
    description: Reservation lifecycle, both the owner-facing and the public no-account booking flow.
  - name: cashbox
    description: The counter's cash shifts (open/close/reconcile) and append-only cash movements.
  - name: clients
    description: The client roster a complex accumulates from its bookings.
  - name: complexes
    description: Venue profile, slug, hours, images and the MercadoPago connection. The tenant boundary.
  - name: courts
    description: Courts, price bands, blocked slots and the public availability grid.
  - name: health
    description: Liveness and operator incident-debugging views.
  - name: leads
    description: Best-effort capture of an email left before a signup completes.
  - name: payments
    description: The MercadoPago payment-provider webhook.
  - name: places
    description: A pass-through proxy to Google Places so the API key never reaches the browser.
  - name: products
    description: The counter's product catalog and its append-only stock ledger (restock, adjustment).
  - name: publicsite
    description: The public storefront's sitemap and crawler-facing prerendered pages.
  - name: realtime
    description: Server-Sent Events feed for an owner dashboard's live booking updates.
  - name: reporting
    description: Read-only, one-complex-scoped analytics and exports.
  - name: sales
    description: Selling products from the catalog — snapshot pricing, stock movement, and a void that reverses both.
  - name: openapi
    description: This document and the interactive reference built from it.

security:
  - {}

paths:
  # ---------------------------------------------------------------------
  # admin
  # ---------------------------------------------------------------------
  /api/v1/admin/stats:
    get:
      tags: [admin]
      operationId: adminGetStats
      summary: Platform-wide statistics
      description: Superadmin only. Cross-tenant by design (bypass reason `platform`).
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Platform statistics.
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats: {$ref: "#/components/schemas/PlatformStats"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: List platform users
      description: Superadmin only. Cross-tenant by design (bypass reason `platform`). Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: role
          in: query
          schema: {type: string, enum: [owner, client, superadmin]}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [users, metadata]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/AdminUserRow"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Malformed cursor.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/users/{id}:
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: Get a platform user and the complexes they own
      description: Superadmin only. Cross-tenant by design (bypass reason `platform`).
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: The user and the complex they own, at most one.
          content:
            application/json:
              schema:
                type: object
                required: [user, complexes]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  complexes:
                    type: array
                    description: At most one item, since one account owns at most one complex.
                    items: {$ref: "#/components/schemas/Complex"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/users/{id}/toggle-active:
    patch:
      tags: [admin]
      operationId: adminToggleUserActive
      summary: Activate or deactivate a platform user
      description: >-
        Superadmin only. Cross-tenant scope is not granted for this route: it writes
        `users.is_active` by primary key and touches no tenant table. Refuses to let a
        superadmin deactivate their own account.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  default: false
                  description: Omitting it deactivates the account, same as sending false.
      responses:
        "200":
          description: The user was updated.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "user updated"}
        "400":
          description: Malformed request body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The caller tried to change their own account status.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/complexes:
    get:
      tags: [admin]
      operationId: adminListComplexes
      summary: List every complex on the platform
      description: Superadmin only. Cross-tenant by design (bypass reason `platform`). Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of complexes.
          content:
            application/json:
              schema:
                type: object
                required: [complexes, metadata]
                properties:
                  complexes:
                    type: array
                    items: {$ref: "#/components/schemas/AdminComplexRow"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Malformed cursor.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/complexes/{id}:
    get:
      tags: [admin]
      operationId: adminGetComplex
      summary: Get one complex with owner and usage figures
      description: >-
        Superadmin only. Cross-tenant by design (bypass reason `platform`, with no ownership
        check by design).
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: The complex plus derived figures.
          content:
            application/json:
              schema:
                type: object
                required:
                  [complex, owner_name, owner_email, courts_count, clients_count, bookings_count, total_revenue]
                properties:
                  complex: {$ref: "#/components/schemas/Complex"}
                  owner_name: {type: string}
                  owner_email: {type: string}
                  courts_count: {type: integer}
                  clients_count: {type: integer}
                  bookings_count: {type: integer}
                  total_revenue:
                    type: integer
                    description: Centavos ARS.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: adminListAuditLog
      summary: List the platform-wide audit trail
      description: Superadmin only. Cross-tenant by design (bypass reason `platform`). Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - name: entity_type
          in: query
          schema: {type: string}
        - name: complex_id
          in: query
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of audit log rows.
          content:
            application/json:
              schema:
                type: object
                required: [audit_logs, metadata]
                properties:
                  audit_logs:
                    type: array
                    items: {$ref: "#/components/schemas/AuditLogRow"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Malformed `complex_id` or cursor.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/admin/healthcheck:
    get:
      tags: [admin, health]
      operationId: adminGetHealthDetailed
      summary: Detailed health check for operators
      description: >-
        Superadmin only. Cross-tenant by design (bypass reason `platform`, queue depths are
        counted across every tenant). Answers `200` with `status: degraded` when Redis or the
        payments circuit breaker is impaired, and `503` when the database is unreachable.
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: The process is available, possibly degraded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthDetailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: The database is unreachable, this instance should be pulled from rotation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthDetailed"}

  # ---------------------------------------------------------------------
  # audit
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/audit-log:
    get:
      tags: [audit]
      operationId: auditListComplexLog
      summary: List a complex's own audit trail
      description: >-
        The tenant-scoped mirror of the platform audit log. The complex is taken from the
        `{id}` path segment consumed by the ownership guard, not from a query parameter, so a
        caller cannot name a tenant other than the one they own. Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: entity_type
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of this complex's audit log rows.
          content:
            application/json:
              schema:
                type: object
                required: [audit_logs, metadata]
                properties:
                  audit_logs:
                    type: array
                    items: {$ref: "#/components/schemas/AuditLogRow"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Invalid cursor value.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # auth
  # ---------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      summary: Register a new owner account
      description: >-
        Public. Not rate limited beyond the shared auth ceiling. Answers `201` identically
        whether the email is new or already registered, to prevent account enumeration. When
        `TURNSTILE_SECRET_KEY` is configured the request must also carry a valid
        `turnstile_token`.
      responses:
        "201":
          description: Verification email sent, or would have been for a new address.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "verification email sent"}
        "400":
          description: Malformed JSON body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, phone]
              properties:
                email: {type: string}
                password: {type: string, minLength: 8, maxLength: 72}
                first_name: {type: string, maxLength: 100}
                last_name: {type: string, maxLength: 100}
                phone:
                  type: string
                  description: Normalized server-side to E.164.
                  example: "+5491112345678"
                turnstile_token:
                  type: string
                  description: Required only when Cloudflare Turnstile is configured.

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Log in and start a session
      description: >-
        Public. Sets the `access_token` and `refresh_token` cookies on success. A wrong
        password, an unknown email, a locked account and an unverified email all answer the
        same `401` message, to prevent enumeration and lockout probing.
      responses:
        "200":
          description: Session established.
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token`.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token:
                    type: string
                    description: Send this back as the `X-CSRF-Token` header on subsequent mutating requests.
        "401":
          description: Invalid credentials, locked account or unverified email (indistinguishable by design).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
                turnstile_token: {type: string}

  /api/v1/auth/google:
    post:
      tags: [auth]
      operationId: authGoogle
      summary: Sign in with a Google Identity Services ID token
      description: >-
        Public. Verifies `credential` against Google's JWKS. An existing account (matched by
        verified email) gets a session exactly like `/auth/login`, `email_verified` is set to
        `true` if it was not already, and the Google account is linked. An address with no
        account answers `200` with `needs_profile: true` and a `profile_token` for
        `/auth/google/complete`, since registration requires a phone number Google never
        provides. `503` when `GOOGLE_OAUTH_CLIENT_ID` is not configured.
      responses:
        "200": {$ref: "#/components/responses/GoogleSignInResult"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: Google sign-in is not configured (no `GOOGLE_OAUTH_CLIENT_ID`), or Google's JWKS is unreachable.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: The Google Identity Services ID token from the client's sign-in button.

  /api/v1/auth/google/complete:
    post:
      tags: [auth]
      operationId: authGoogleComplete
      summary: Finish a first-time Google sign-in by supplying a phone number
      description: >-
        Public. Consumes the `profile_token` from `/auth/google`'s `needs_profile` answer,
        creates the account with `email_verified: true` and a session exactly like
        `/auth/login`. `first_name`/`last_name` are optional overrides of the profile token's own
        Google-supplied names. `409` if the address was claimed between the two requests. `503`
        when `GOOGLE_OAUTH_CLIENT_ID` is not configured.
      responses:
        "200":
          description: Account created and session established.
          headers:
            Set-Cookie:
              description: Sets `access_token` and `refresh_token`.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token:
                    type: string
                    description: Send this back as the `X-CSRF-Token` header on subsequent mutating requests.
        "401":
          description: Missing, expired, forged or wrong-purpose profile token.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: An account for this address was created between `/auth/google` and this request.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: Google sign-in is not configured (no `GOOGLE_OAUTH_CLIENT_ID`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_token, phone]
              properties:
                profile_token: {type: string}
                phone:
                  type: string
                  description: Normalized server-side to E.164.
                  example: "+5491112345678"
                first_name: {type: string, maxLength: 100, description: "Overrides the profile token's given_name."}
                last_name: {type: string, maxLength: 100, description: "Overrides the profile token's family_name."}

  /api/v1/auth/google/redirect:
    post:
      tags: [auth]
      operationId: authGoogleRedirect
      summary: Receive Google's redirect-mode form post and hand back a one-time code
      description: >-
        Public, and not called by the frontend's own code: this is the `login_uri` Google posts
        to when the client asks for `ux_mode: 'redirect'`, which exists because popup mode opens
        a blank page on many mobile browsers. Google posts
        `application/x-www-form-urlencoded` with `credential` (the ID token) and `g_csrf_token`,
        and sets a `g_csrf_token` cookie on the app's origin; the frontend proxies
        `https://app.vibe.com.ar/auth/google/callback` here with the body and cookies intact.


        The request is a top-level cross-site form navigation, so it establishes **nothing**: no
        session cookie is ever set here. On success the answer is `303` to
        `<FRONTEND_URL>/auth/google/return?code=<code>`, carrying an opaque, single-use code
        that expires in 120 seconds and is spent against `/auth/google/exchange` from the app's
        own origin.


        The code is bound to the browser it was issued to: the SHA-256 of the validated
        `g_csrf_token` is stored beside the verified claims, and the exchange has to present the
        same value — read back off the cookie Google set on the app's origin — or it establishes
        nothing. Without that binding the code would be an unbound bearer, and anybody holding a
        valid Google ID token could mint one and send a victim the return URL, whose browser
        would spend it and be signed in as the attacker.


        Every failure is a `303` as well, because the response is a page a person sees rather
        than JSON a client reads. A CSRF cookie/field that is missing or unequal (compared in
        constant time), a wrong content type, an oversized body, a missing or rejected
        credential all redirect to `<FRONTEND_URL>/login?error=google_rejected`; Google not
        being configured and any internal failure redirect to
        `<FRONTEND_URL>/login?error=google_unavailable`. The reason is logged and never shown.
        `501` is the one exception: with no `FRONTEND_URL` there is nowhere to redirect to.
      responses:
        "303":
          description: >-
            Always, on success and on every failure alike. `Location` is
            `<FRONTEND_URL>/auth/google/return?code=<code>` on success, and
            `<FRONTEND_URL>/login?error=google_rejected` or
            `<FRONTEND_URL>/login?error=google_unavailable` otherwise.
          headers:
            Location:
              description: Where the browser continues. Never carries a session or a profile token.
              schema: {type: string}
            Cache-Control:
              description: Always `no-store` — the location carries a one-time code.
              schema: {type: string}
        "429": {$ref: "#/components/responses/RateLimited"}
        "501":
          description: >-
            `FRONTEND_URL` is not configured, so there is no address to redirect to. The only
            answer this endpoint gives that is not a redirect.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [credential, g_csrf_token]
              properties:
                credential:
                  type: string
                  description: The Google Identity Services ID token.
                g_csrf_token:
                  type: string
                  description: >-
                    Google's double-submit token. Must equal the `g_csrf_token` cookie Google set
                    on the app's origin.
                select_by:
                  type: string
                  description: How the account was chosen. Sent by Google, ignored here.
                client_id:
                  type: string
                  description: The OAuth client id. Sent by Google, ignored here — the audience is checked on the token itself.

  /api/v1/auth/google/exchange:
    post:
      tags: [auth]
      operationId: authGoogleExchange
      summary: Spend a redirect-mode one-time code for a session
      description: >-
        Public. Consumes the `code` `/auth/google/redirect` put in the URL and answers exactly
        what `/auth/google` answers: a session with its cookies, or `needs_profile` with a
        profile token for `/auth/google/complete`. This is where the session cookies are set —
        the redirect endpoint never sets any.


        The code is single-use and expires in 120 seconds, and it is bound to the browser the
        redirect was delivered to — see `g_csrf_token` below. An unknown code, an expired or
        already-spent one, and one presented with the wrong `g_csrf_token` all answer `422` on
        field `code` with "invalid or expired": which it was is never revealed, and the code is
        consumed either way, so a guessed pairing cannot be retried. `503` when
        `GOOGLE_OAUTH_CLIENT_ID` is not configured.
      responses:
        "200": {$ref: "#/components/responses/GoogleSignInResult"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: Google sign-in is not configured (no `GOOGLE_OAUTH_CLIENT_ID`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, g_csrf_token]
              properties:
                code:
                  type: string
                  description: The opaque one-time code from `/auth/google/redirect`'s `Location`.
                g_csrf_token:
                  type: string
                  description: >-
                    The value of the `g_csrf_token` cookie Google set on the app's origin, read
                    back by the return page. It binds the code to the browser the redirect was
                    delivered to: the server compares its hash, in constant time, against the one
                    stored when the code was issued. A browser that cannot produce it — because
                    it blocks the cookie — fails closed here.

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the session using the refresh cookie
      description: >-
        Public by necessity: it runs on an expired access token. Reads only the `refresh_token`
        cookie, no body. Presenting an already-rotated token within a 30 second grace window is
        treated as a benign concurrent-tab race; outside that window every session for the user
        is revoked as suspected theft.
      responses:
        "200":
          description: Session rotated.
          headers:
            Set-Cookie:
              description: Rotates `access_token` and `refresh_token`.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: {type: string}
        "401":
          description: Missing, unknown or reused refresh token, or an inactive user.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: End the current session
      description: >-
        Public by design, so it also succeeds with no session at all. Clears both cookies,
        deletes the refresh token and blacklists the current access token when present.
      responses:
        "200":
          description: Always returned, even with no active session.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "successfully logged out"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: authVerifyEmail
      summary: Verify an email address by token
      security: []
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "email verified successfully"}
        "400":
          description: Missing token, malformed body, or the token does not resolve.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: authResendVerification
      summary: Resend the verification email
      description: >-
        Public. Always answers the same `200` message regardless of whether the email exists,
        is already verified, or is under a cooldown, to prevent enumeration and spam.
      responses:
        "200":
          description: Always returned.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "if the email exists, a verification link has been sent"}
        "400":
          description: Malformed JSON body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Omitting it, or an unknown address, still answers the same 200 message.

  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      operationId: authForgotPassword
      summary: Request a password reset email
      description: Public. Always answers the same `200` message, and audits the attempt unconditionally before any lookup.
      responses:
        "200":
          description: Always returned.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "if the email exists, a password reset link has been sent"}
        "400":
          description: Malformed JSON body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Omitting it, or an unknown address, still answers the same 200 message.
                turnstile_token: {type: string}

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      operationId: authResetPassword
      summary: Reset a password using an emailed token
      description: >-
        Public. On success revokes every existing session for the account and deletes every
        outstanding reset token.
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "password reset successfully"}
        "400":
          description: The token is invalid, expired, or belongs to an inactive user.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 8, maxLength: 72}

  /api/v1/auth/confirm-email-change:
    post:
      tags: [auth]
      operationId: authConfirmEmailChange
      summary: Confirm a pending email change using an emailed token
      description: >-
        Public, token-authenticated — the same posture as `POST /auth/reset-password`. The token
        proves control of the account's CURRENT address: the link is emailed there by `PUT /auth/me`,
        never to the new one. A session cookie cannot substitute for that, which is what stops a
        hijacked session from moving the account's recovery channel unnoticed. This request does
        NOT itself prove control of the new address — only the ordinary verification email sent to
        it afterward does. On success sets `users.email` to the address the token was issued for,
        clears `email_verified`, re-sends that ordinary verification email to the new address, and
        revokes every existing session for the account, exactly as a password reset does.
        Cross-tenant bypass reason `platform`.
      security: []
      responses:
        "200":
          description: Email address updated.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "email address updated"}
        "400":
          description: The token is invalid, expired, or already used.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: authGetCurrentUser
      summary: Get the current session's user
      description: >-
        The frontend bootstraps every fresh page load from here, so the answer also carries the
        session's CSRF token: it is derived from the access token the request authenticated with
        and rotates nothing. A page load therefore never spends the refresh token; `/auth/refresh`
        is only called once the access token has expired and this endpoint answered 401.
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: >-
            The authenticated user and the CSRF token bound to this access token. `pending_email`
            is the address of a not-yet-confirmed email change (see `PUT /auth/me`), or null when
            there is none.
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, pending_email]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token: {type: string}
                  pending_email: {type: string, nullable: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      tags: [auth]
      operationId: authUpdateCurrentUser
      summary: Update the current account
      description: >-
        All body fields are optional pointers, omitted means unchanged. Changing `email` does NOT
        change the account's address: it creates a pending email-change request and emails a
        confirmation link to the CURRENT address (see `POST /auth/confirm-email-change`), because
        the address is the account's password-recovery channel and a session alone is not proof of
        control over the new one. `email_change` reports what happened to that request: `none`
        when the body did not ask for a different address (a missing `email`, or the same address
        modulo case), `requested` when the pending request was saved and the confirmation email
        enqueued, `failed` when saving or enqueueing it failed after every other field in this PUT
        had already committed — the response still reports success, and `pending_email` still
        reflects whatever request (if any) is actually stored, never a request this call failed to
        save. Changing `phone` to a non-normalizing value is refused unless it is byte-identical to
        the value already stored (grandfathers pre-existing bad numbers). Changing the password
        requires both `current_password` and `new_password`, and revokes every other session.
        Cross-tenant bypass reason `platform`.
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200":
          description: >-
            The account as it stands right after this request. `pending_email` is the address
            named by the just-created (or a still-live earlier) email-change request, or null.
            `email_change` is `none`, `requested`, or `failed` — see this operation's description.
          content:
            application/json:
              schema:
                type: object
                required: [user, pending_email, email_change]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  pending_email: {type: string, nullable: true}
                  email_change:
                    type: string
                    enum: [none, requested, failed]
        "401":
          description: Unauthenticated, or `current_password` did not match.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: >-
                    A value different from the current address creates a pending email-change
                    request instead of changing it; see this operation's description.
                first_name: {type: string, maxLength: 100}
                last_name: {type: string, maxLength: 100}
                phone: {type: string}
                current_password: {type: string}
                new_password: {type: string, minLength: 8, maxLength: 72}
    delete:
      tags: [auth]
      operationId: authDeleteAccount
      summary: Delete the current account
      description: >-
        Cascades to every complex, court, client and booking the account owns. Cross-tenant
        bypass reason `by-owner`.
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "account deleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: The account has a complex with active bookings.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # bookings
  # ---------------------------------------------------------------------
  /api/v1/webhooks/whatsapp:
    get:
      tags: [bookings]
      operationId: bookingsWhatsAppVerifyWebhook
      summary: Meta's WhatsApp webhook subscription handshake
      description: Public, not rate limited. Authenticated by Meta's `hub.verify_token`, not a session.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: {type: string, enum: [subscribe]}
        - name: hub.verify_token
          in: query
          required: true
          schema: {type: string}
        - name: hub.challenge
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Echoes `hub.challenge` back verbatim.
          content:
            text/plain:
              schema: {type: string}
        "403":
          description: Bad mode or wrong verify token.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    post:
      tags: [bookings]
      operationId: bookingsWhatsAppWebhook
      summary: Receive a WhatsApp Cloud API webhook delivery
      description: >-
        Public, not rate limited. HMAC-SHA256 signed (`X-Hub-Signature-256`), verified before
        the body is trusted. Always answers `200` except for a bad signature (`401`, empty
        body), so Meta never redelivers a message this service already saw. Inbound text is
        only logged, this endpoint changes no booking state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Meta Cloud API webhook payload.
              additionalProperties: true
      responses:
        "200":
          description: Accepted (also returned for an unreadable or unparseable body, to stop redelivery).
        "401":
          description: Invalid signature. Empty body.

  /api/v1/book:
    post:
      tags: [bookings]
      operationId: bookingsPublicCreate
      summary: Create a booking without an account
      description: >-
        Public. Rate limited under the dedicated `book` ceiling (1 request per 20 seconds,
        burst 3) in addition to the general ceiling. Cross-tenant bypass reason `resolves`. The
        booking's primary key is deliberately never included in the response, only the opaque
        `token` used by the status/cancel endpoints below.
      security: []
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: Booking created, awaiting payment confirmation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicBookingResult"}
        "400":
          description: Malformed body, or the complex has no MercadoPago connected.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404":
          description: Unknown or inactive complex or court, or the court belongs to a different complex.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: Past date, outside opening hours, off the price grid, blocked, unpriced, or a slot-lock conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: MercadoPago checkout preference creation failed. The booking is auto-cancelled.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [complex_id, court_id, date, start_time, duration_minutes,
                 client_first_name, client_last_name, client_phone]
              properties:
                complex_id: {type: string, format: uuid}
                court_id: {type: string, format: uuid}
                date: {type: string, format: date}
                start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                duration_minutes: {type: integer, description: "Must be one of the permitted slot durations."}
                client_first_name: {type: string}
                client_last_name: {type: string}
                client_phone: {type: string, description: "Normalized to E.164.", example: "+5491112345678"}
                client_email: {type: string}
                client_notes: {type: string, maxLength: 2000}

  /api/v1/book/status:
    get:
      tags: [bookings]
      operationId: bookingsPublicStatus
      summary: Look up a public booking by its link token
      security: []
      parameters:
        - {$ref: "#/components/parameters/BookingToken"}
      responses:
        "200":
          description: The booking's current status.
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: {$ref: "#/components/schemas/PublicBookingStatus"}
        "400":
          description: Missing token.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/LinkExpired"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/book/cancel-info:
    get:
      tags: [bookings]
      operationId: bookingsPublicCancelInfo
      summary: Preview refund terms before cancelling a public booking
      security: []
      parameters:
        - {$ref: "#/components/parameters/BookingToken"}
      responses:
        "200":
          description: What cancelling now would do.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicCancelInfo"}
        "400":
          description: Missing token.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/LinkExpired"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/book/cancel:
    post:
      tags: [bookings]
      operationId: bookingsPublicCancel
      summary: Cancel a public booking by its link token
      description: >-
        Public. Respects the complex's cancellation window (unlike the staff cancel endpoint).
        Cross-tenant bypass reason `resolves`.
      security: []
      responses:
        "200":
          description: Cancelled, with the resulting refund outcome.
          content:
            application/json:
              schema:
                type: object
                required: [booking, refunded, refund]
                properties:
                  booking:
                    type: object
                    required: [status, collection_status, refund_status]
                    properties:
                      status: {$ref: "#/components/schemas/BookingStatus"}
                      collection_status: {$ref: "#/components/schemas/CollectionStatus"}
                      refund_status: {$ref: "#/components/schemas/RefundStatus"}
                  refunded: {type: boolean}
                  refund: {$ref: "#/components/schemas/RefundOutcome"}
        "400":
          description: The booking is already cancelled or completed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/LinkExpired"}
        "422":
          description: Missing token.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}

  /api/v1/complexes/{id}/bookings:
    get:
      tags: [bookings]
      operationId: bookingsList
      summary: List a complex's bookings for one day
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: status
          in: query
          description: Filtered in application code, not a database predicate.
          schema: {$ref: "#/components/schemas/BookingStatus"}
        - name: search
          in: query
          description: Matches client name or phone. Filtered in application code.
          schema: {type: string}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of bookings for the given day.
          content:
            application/json:
              schema:
                type: object
                required: [bookings, metadata]
                properties:
                  bookings:
                    type: array
                    items: {$ref: "#/components/schemas/Booking"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Missing or malformed `date`, or an invalid cursor.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [bookings]
      operationId: bookingsCreate
      summary: Create a staff booking, confirmed immediately
      description: No payment step. Optionally records a counter payment (any method but MercadoPago) in the same call.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: Booking created and confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A blocked slot, a blocked client, or a concurrent slot conflict.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [court_id, date, start_time, client_phone, client_first_name, client_last_name, duration_minutes]
              properties:
                court_id: {type: string, format: uuid}
                date: {type: string, format: date}
                start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                duration_minutes: {type: integer}
                client_phone: {type: string, example: "+5491112345678"}
                client_email: {type: string}
                client_first_name: {type: string}
                client_last_name: {type: string}
                payment_method: {type: string, enum: ["", cash, transfer, debit_card, credit_card, qr_wallet]}
                payment_option: {type: string, enum: ["", unpaid, deposit, full]}
                notes: {type: string}
                deposit_amount: {type: integer, description: "Centavos ARS."}
                price: {type: integer, description: "Centavos ARS. Required when no price rule covers the slot."}

  /api/v1/complexes/{id}/bookings/{bookingID}:
    get:
      tags: [bookings]
      operationId: bookingsGet
      summary: Get one booking with its client and payments
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/BookingID"}
      responses:
        "200":
          description: The booking, its payments, and its client and current payment when resolvable.
          content:
            application/json:
              schema:
                type: object
                required: [booking, payments]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
                  client: {$ref: "#/components/schemas/Client"}
                  payment: {$ref: "#/components/schemas/Payment"}
                  payments:
                    type: array
                    items: {$ref: "#/components/schemas/Payment"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [bookings]
      operationId: bookingsUpdate
      summary: Update a booking's status or notes
      description: >-
        Every status field is optional and independently validated against a legal-transition
        matrix. Cancelling a paid booking here is refused, use the dedicated cancel endpoint.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/BookingID"}
      responses:
        "200":
          description: The updated booking.
          content:
            application/json:
              schema:
                type: object
                required: [booking]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
        "400":
          description: Malformed body, or an attempt to cancel a paid booking through this endpoint.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Illegal collection or refund status transition, or a concurrent edit.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {$ref: "#/components/schemas/BookingStatus"}
                collection_status: {$ref: "#/components/schemas/CollectionStatus"}
                refund_status: {$ref: "#/components/schemas/RefundStatus"}
                notes: {type: string}

  /api/v1/complexes/{id}/bookings/{bookingID}/cancel:
    post:
      tags: [bookings]
      operationId: bookingsCancel
      summary: Staff-cancel a booking, refunding if money was collected
      description: >-
        Ignores the complex's cancellation window, unlike the public cancel endpoint.
        Cancelling an already-cancelled booking is idempotent and answers `200` unchanged.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/BookingID"}
      responses:
        "200":
          description: The booking and the resulting refund outcome.
          content:
            application/json:
              schema:
                type: object
                required: [booking, refund]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
                  refund: {$ref: "#/components/schemas/RefundOutcome"}
        "400":
          description: The booking is already completed or a no-show, both terminal.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}

  /api/v1/complexes/{id}/bookings/{bookingID}/confirm-payment:
    post:
      tags: [bookings]
      operationId: bookingsConfirmPayment
      summary: Record a counter payment taken by staff
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/BookingID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The booking and the payment row created for it.
          content:
            application/json:
              schema:
                type: object
                required: [booking, payment]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
                  payment: {$ref: "#/components/schemas/Payment"}
        "400":
          description: The booking is cancelled, or already fully paid.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A blocked slot, or a concurrent edit.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
                amount: {type: integer, minimum: 1, maximum: 99999999, description: "Centavos ARS."}

  /api/v1/complexes/{id}/bookings/{bookingID}/manual-refund:
    post:
      tags: [bookings]
      operationId: bookingsManualRefund
      summary: Close out the manual half of a split refund
      description: >-
        Only legal when the booking reads `status: cancelled` and `refund_status: partial`,
        meaning an automatic refund covered part of the payment and the rest must be handed
        back by hand (any counter method).
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/BookingID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The booking, its payments, and how much was returned.
          content:
            application/json:
              schema:
                type: object
                required: [booking, payments, returned_amount]
                properties:
                  booking: {$ref: "#/components/schemas/Booking"}
                  payments:
                    type: array
                    items: {$ref: "#/components/schemas/Payment"}
                  returned_amount: {type: integer, description: "Centavos ARS."}
        "400":
          description: No manual refund is pending on this booking.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            The `Idempotency-Key` was already used for a different request, or a request
            using it is still running.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # cashbox
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/cash-sessions:
    get:
      tags: [cashbox]
      operationId: cashSessionsList
      summary: List this complex's cash session history
      description: Newest (most recently opened) first. Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of this complex's cash sessions.
          content:
            application/json:
              schema:
                type: object
                required: [cash_sessions, metadata]
                properties:
                  cash_sessions:
                    type: array
                    items: {$ref: "#/components/schemas/CashSession"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Invalid cursor value.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [cashbox]
      operationId: cashSessionsOpen
      summary: Open a cash session
      description: Refused with 409 if this complex already has one open.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The opened session.
          content:
            application/json:
              schema:
                type: object
                required: [cash_session]
                properties:
                  cash_session: {$ref: "#/components/schemas/CashSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: This complex already has an open cash session.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_cash]
              properties:
                opening_cash:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 99999999999
                  description: >-
                    Centavos ARS. Nullable only so a request that omits it decodes to a Go nil
                    rather than a valid-looking 0 — 0 is itself a legitimate opening float — and
                    the handler can tell "not sent" from "sent as zero" and refuse the former.
                    The request validator that would otherwise catch a missing required field
                    never runs in production (internal/middleware/openapi.go), so the handler is
                    the only place this is actually enforced (pos-cashbox T2 review).
                note: {type: string, maxLength: 500, description: Stored as the session's opening_note.}

  /api/v1/complexes/{id}/cash-session:
    get:
      tags: [cashbox]
      operationId: cashSessionsCurrent
      summary: Get the currently open cash session
      description: >-
        404 when no session is open. Deliberately its own singular path — not nested under
        /cash-sessions/ as .../current — because a literal path segment sitting next to
        /cash-sessions/{sessionID}'s wildcard is an unresolvable route conflict for this API's
        router (net/http's ServeMux refuses to decide between a specific literal path that
        matches every method and a method-qualified pattern on a wildcard sibling).
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: The open session and its live reconciliation summary.
          content:
            application/json:
              schema:
                type: object
                required: [cash_session, summary]
                properties:
                  cash_session: {$ref: "#/components/schemas/CashSession"}
                  summary: {$ref: "#/components/schemas/CashSessionSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/cash-sessions/{sessionID}:
    get:
      tags: [cashbox]
      operationId: cashSessionsGet
      summary: Get one cash session, open or closed
      description: Includes its reconciliation summary and its full movement ledger.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SessionID"}
      responses:
        "200":
          description: The session, its summary and its movements.
          content:
            application/json:
              schema:
                type: object
                required: [cash_session, summary, movements]
                properties:
                  cash_session: {$ref: "#/components/schemas/CashSession"}
                  summary: {$ref: "#/components/schemas/CashSessionSummary"}
                  movements:
                    type: array
                    items: {$ref: "#/components/schemas/CashMovement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/cash-sessions/{sessionID}/close:
    post:
      tags: [cashbox]
      operationId: cashSessionsClose
      summary: Close a cash session
      description: >-
        counted_cash is what the owner physically counted in the drawer. expected_cash is
        computed and snapshotted at close time; difference is counted minus expected. A closed
        session is immutable and can never be reopened.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SessionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The closed session.
          content:
            application/json:
              schema:
                type: object
                required: [cash_session]
                properties:
                  cash_session: {$ref: "#/components/schemas/CashSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: This session is not open (already closed, or closed by a concurrent request).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_cash]
              properties:
                counted_cash:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 99999999999
                  description: >-
                    Centavos ARS, physically counted. Nullable for the same reason
                    CashSessionsOpen's opening_cash is: 0 is a legitimate count (an empty
                    drawer), so a missing field has to decode to nil, not a valid-looking 0, for
                    the handler to tell the two apart and refuse the former.
                note:
                  type: string
                  maxLength: 500
                  description: Stored as the session's closing_note. Never touches opening_note.

  /api/v1/complexes/{id}/cash-sessions/{sessionID}/movements:
    post:
      tags: [cashbox]
      operationId: cashMovementsCreate
      summary: Record a cash movement (income or expense)
      description: sessionID must be the currently open session.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SessionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The recorded movement.
          content:
            application/json:
              schema:
                type: object
                required: [cash_movement]
                properties:
                  cash_movement: {$ref: "#/components/schemas/CashMovement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: This session is not open.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, category, method, amount]
              properties:
                kind: {type: string, enum: [income, expense]}
                category:
                  type: string
                  enum: [other_income, supplies, salaries, services, maintenance, cleaning, withdrawal, other_expense]
                  description: "other_income for income; one of the rest for expense."
                method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
                amount: {type: integer, minimum: 1, maximum: 2000000000, description: "Centavos ARS."}
                note: {type: string, maxLength: 500}

  /api/v1/complexes/{id}/cash-sessions/{sessionID}/movements/{movementID}/void:
    post:
      tags: [cashbox]
      operationId: cashMovementsVoid
      summary: Void an earlier movement
      description: >-
        Creates a new movement with the opposite kind and the same amount/method/category as the
        one sessionID/movementID names, always in the CURRENTLY open session — which may not be
        sessionID, when correcting a movement from an earlier, already-closed shift. Refused with
        409 if the original is already voided or is itself a void.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SessionID"}
        - {$ref: "#/components/parameters/MovementID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The void movement.
          content:
            application/json:
              schema:
                type: object
                required: [cash_movement]
                properties:
                  cash_movement: {$ref: "#/components/schemas/CashMovement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No session is open, the original is already voided, or the original is itself a void.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}

  # ---------------------------------------------------------------------
  # clients
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/clients:
    get:
      tags: [clients]
      operationId: clientsList
      summary: List a complex's clients
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: search
          in: query
          description: Matched against client name and phone.
          schema: {type: string}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of clients.
          content:
            application/json:
              schema:
                type: object
                required: [clients, metadata]
                properties:
                  clients:
                    type: array
                    items: {$ref: "#/components/schemas/Client"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Invalid cursor value.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/clients/{clientID}:
    get:
      tags: [clients]
      operationId: clientsGet
      summary: Get one client with their recent bookings
      description: >-
        Answers `404`, not `403`, when the client belongs to a different complex, so this
        endpoint cannot be used to probe which client ids exist elsewhere.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "200":
          description: The client and up to 20 recent bookings.
          content:
            application/json:
              schema:
                type: object
                required: [client, recent_bookings]
                properties:
                  client: {$ref: "#/components/schemas/Client"}
                  recent_bookings:
                    type: array
                    items: {$ref: "#/components/schemas/Booking"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [clients]
      operationId: clientsUpdate
      summary: Update a client's notes or blocked status
      description: >-
        Only `notes` and `is_blocked` are owner-editable. Identity fields come from bookings
        and cannot be written here.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "200":
          description: The updated client.
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: {$ref: "#/components/schemas/Client"}
        "400":
          description: Malformed body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: {type: string}
                is_blocked: {type: boolean}

  # ---------------------------------------------------------------------
  # complexes
  # ---------------------------------------------------------------------
  /api/v1/public/complexes/{slug}:
    get:
      tags: [complexes]
      operationId: complexesGetPublic
      summary: The public storefront landing page for a complex
      description: Public. Cross-tenant bypass reason `resolves`. Strips owner and MercadoPago identifiers.
      security: []
      parameters:
        - {$ref: "#/components/parameters/PathSlug"}
      responses:
        "200":
          description: The complex, its active courts and their prices, and its schedule.
          content:
            application/json:
              schema:
                type: object
                required: [complex, courts, schedules]
                properties:
                  complex: {$ref: "#/components/schemas/PublicComplex"}
                  courts:
                    type: array
                    items: {$ref: "#/components/schemas/CourtWithPrices"}
                  schedules:
                    type: array
                    items: {$ref: "#/components/schemas/Schedule"}
        "404":
          description: Unknown slug, or the complex is inactive.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/slug-available:
    get:
      tags: [complexes]
      operationId: complexesSlugAvailable
      summary: Check whether a slug is free platform-wide
      description: >-
        Not nested under `/complexes/`: the router this route was first written for could not
        mix a static segment with the `{id}` wildcard registered at that position. The address
        is kept as it is because it is the one clients call. Cross-tenant bypass reason
        `platform` (a global uniqueness check).
      security: [{cookieAuth: []}]
      parameters:
        - name: slug
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: >-
            Always `200`, even for an empty or malformed slug (answered as unavailable and
            invalid rather than as an error).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SlugAvailability"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes:
    get:
      tags: [complexes]
      operationId: complexesList
      summary: List the complexes the caller owns
      description: >-
        Not paginated: one account owns at most one complex, so the array holds either the
        caller's single complex or is empty. Cross-tenant bypass reason `by-owner` (filtered
        by `owner_id` in SQL).
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: The caller's complex, as a single-item array, or an empty array if the account owns none.
          content:
            application/json:
              schema:
                type: object
                required: [complexes]
                properties:
                  complexes:
                    type: array
                    items: {$ref: "#/components/schemas/Complex"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [complexes]
      operationId: complexesCreate
      summary: Create a new complex
      description: >-
        Cross-tenant bypass reason `bootstrap`. Refused if the account already owns a complex:
        one account owns exactly one. Seeds 7 default schedule rows (Monday through Sunday,
        08:00 to 23:00).
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "201":
          description: The created complex.
          content:
            application/json:
              schema:
                type: object
                required: [complex]
                properties:
                  complex: {$ref: "#/components/schemas/Complex"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The account already owns a complex.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, address, city, province, phone, cancellation_hours]
              properties:
                name: {type: string, maxLength: 200}
                slug: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}
                address: {type: string}
                city: {type: string}
                province: {type: string}
                phone: {type: string}
                email: {type: string}
                deposit_percentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 0
                  description: Defaults to 0 (no deposit required) when omitted.
                cancellation_hours: {type: integer, minimum: 1, maximum: 168}
                latitude: {type: number, format: double}
                longitude: {type: number, format: double}
                amenities:
                  type: array
                  description: >-
                    What the venue offers, from a closed vocabulary. Omitted or `[]` both mean
                    none.
                  items:
                    type: string
                    enum:
                      - parking
                      - changing_rooms
                      - showers
                      - bar
                      - racket_rental
                      - pro_shop
                      - wifi
                      - lockers
                      - lessons
                      - tournaments
                      - accessible
                      - match_recording

  /api/v1/complexes/{id}:
    get:
      tags: [complexes]
      operationId: complexesGet
      summary: Get a complex by id, owner view
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: The full, owner-facing complex, including MercadoPago fields.
          content:
            application/json:
              schema:
                type: object
                required: [complex]
                properties:
                  complex: {$ref: "#/components/schemas/Complex"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      tags: [complexes]
      operationId: complexesUpdate
      summary: Update a complex's profile
      description: >-
        Every field is an optional pointer. Slug uniqueness is re-checked only when it
        actually changes. Amenities are validated against a closed vocabulary.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/IfMatchVersion"}
      responses:
        "200":
          description: The updated complex.
          content:
            application/json:
              schema:
                type: object
                required: [complex]
                properties:
                  complex: {$ref: "#/components/schemas/Complex"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    The row version the client read before it edited. Same meaning as `If-Match`,
                    which wins where both are sent; omitting both is last-write-wins.
                name: {type: string}
                slug: {type: string}
                address: {type: string}
                city: {type: string}
                province: {type: string}
                phone: {type: string}
                email: {type: string}
                logo_url: {type: string}
                cover_url: {type: string}
                deposit_percentage: {type: integer, minimum: 0, maximum: 100}
                cancellation_hours: {type: integer, minimum: 1, maximum: 168}
                is_active: {type: boolean}
                latitude: {type: number, format: double}
                longitude: {type: number, format: double}
                amenities:
                  type: array
                  items:
                    type: string
                    enum:
                      - parking
                      - changing_rooms
                      - showers
                      - bar
                      - racket_rental
                      - pro_shop
                      - wifi
                      - lockers
                      - lessons
                      - tournaments
                      - accessible
                      - match_recording
    delete:
      tags: [complexes]
      operationId: complexesDelete
      summary: Soft-delete a complex and its courts
      description: The one cascading write in this module. Refused while the complex has active bookings.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message, courts_deactivated]
                properties:
                  message: {type: string, example: "complex deleted"}
                  courts_deactivated: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The complex has active bookings.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/schedules:
    put:
      tags: [complexes]
      operationId: complexesUpdateSchedules
      summary: Replace a complex's weekly opening hours
      description: >-
        Requires exactly 7 entries, one per weekday, no duplicates. `close_time` before
        `open_time` is valid and means the venue closes after midnight.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: The updated schedule.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: {$ref: "#/components/schemas/Schedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedules]
              properties:
                schedules:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day]
                    properties:
                      day: {$ref: "#/components/schemas/Weekday"}
                      open_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                      close_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                      is_closed:
                        type: boolean
                        default: false
                        description: Omitting it means open, same as sending false.

  /api/v1/complexes/{id}/uploads/presign:
    post:
      tags: [complexes]
      operationId: complexesPresignUpload
      summary: Get a short-lived presigned URL to upload a logo or cover image
      description: >-
        Browsers upload directly to object storage, image bytes never traverse this service.
        Answers `501` when no storage backend is configured.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: A 10 minute presigned PUT URL.
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, public_url, key]
                properties:
                  upload_url: {type: string, format: uri}
                  public_url: {type: string, format: uri}
                  key: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "501":
          description: No object storage backend is configured.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content_type, file_size]
              properties:
                type: {type: string, enum: [logo, cover]}
                content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
                file_size: {type: integer, minimum: 1, maximum: 5242880, description: "Bytes, capped at 5 MiB."}

  /api/v1/complexes/{id}/uploads:
    delete:
      tags: [complexes]
      operationId: complexesDeleteUpload
      summary: Delete a previously uploaded logo or cover image
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "deleted"}
        "400":
          description: The URL does not belong to this storage.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: >-
            The key exists but does not fall under this complex's own storage prefix (reported
            as 404, not 403, so this cannot be used to probe another tenant's storage keys).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "501":
          description: No object storage backend is configured.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri}

  /api/v1/complexes/{id}/mp/connect:
    post:
      tags: [complexes]
      operationId: complexesConnectMercadoPago
      summary: Connect the complex's MercadoPago account (OAuth PKCE exchange)
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [connected, mp_user_id]
                properties:
                  connected: {type: boolean, example: true}
                  mp_user_id: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500":
          description: >-
            The OAuth exchange with MercadoPago failed. Unlike most 500s, this message includes
            the wrapped error detail.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: {type: string}
                redirect_uri: {type: string, format: uri}
                code_verifier: {type: string}
    delete:
      tags: [complexes]
      operationId: complexesDisconnectMercadoPago
      summary: Disconnect the complex's MercadoPago account
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                required: [connected]
                properties:
                  connected: {type: boolean, example: false}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The complex has active bookings.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/mp/status:
    get:
      tags: [complexes]
      operationId: complexesMercadoPagoStatus
      summary: Get the complex's MercadoPago connection status
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Connection status.
          content:
            application/json:
              schema:
                type: object
                required: [connected]
                properties:
                  connected: {type: boolean}
                  app_id: {type: string, description: "Present only when MP_APP_ID is configured."}
                  mp_user_id: {type: string, description: "Present only when connected and set."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # courts
  # ---------------------------------------------------------------------
  /api/v1/public/complexes/{slug}/availability:
    get:
      tags: [courts]
      operationId: courtsPublicAvailability
      summary: The storefront's bookable-slot grid for one day
      description: >-
        Public. Cross-tenant bypass reason `resolves`. Unpriced slots are omitted from the
        `slots` array. Booked, blocked and past slots are included with `available: false`. A
        closed day or a complex with zero active courts answers `200` with `is_open: false`
        rather than an error.
      security: []
      parameters:
        - {$ref: "#/components/parameters/PathSlug"}
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: duration
          in: query
          description: Defaults to the platform's default slot duration. Must be one of the permitted durations.
          schema: {type: integer}
      responses:
        "200":
          description: The day's availability grid.
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability: {$ref: "#/components/schemas/Availability"}
        "400":
          description: Missing `date`.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "404":
          description: Unknown slug, or the complex is inactive.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/courts:
    get:
      tags: [courts]
      operationId: courtsList
      summary: List every court in a complex
      description: Includes inactive courts, the owner manages both.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Every court, with its price bands.
          content:
            application/json:
              schema:
                type: object
                required: [courts]
                properties:
                  courts:
                    type: array
                    items: {$ref: "#/components/schemas/CourtWithPrices"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [courts]
      operationId: courtsCreate
      summary: Create a court
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "201":
          description: The created court.
          content:
            application/json:
              schema:
                type: object
                required: [court]
                properties:
                  court: {$ref: "#/components/schemas/Court"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sport, court_type]
              properties:
                name: {type: string, maxLength: 100}
                sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
                court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
                description: {type: string, maxLength: 200}

  /api/v1/complexes/{id}/courts/{courtID}:
    put:
      tags: [courts]
      operationId: courtsUpdate
      summary: Update a court
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/CourtID"}
        - {$ref: "#/components/parameters/IfMatchVersion"}
      responses:
        "200":
          description: The updated court.
          content:
            application/json:
              schema:
                type: object
                required: [court]
                properties:
                  court: {$ref: "#/components/schemas/Court"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    The row version the client read before it edited. Same meaning as `If-Match`,
                    which wins where both are sent; omitting both is last-write-wins.
                name: {type: string, maxLength: 100}
                sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
                court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
                description: {type: string, maxLength: 200}
                is_active: {type: boolean}
    delete:
      tags: [courts]
      operationId: courtsDelete
      summary: Soft-delete a court
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/CourtID"}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "court deleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The court has active bookings.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/courts/{courtID}/prices:
    put:
      tags: [courts]
      operationId: courtsUpdatePrices
      summary: Replace a court's price bands
      description: >-
        Full wholesale replacement. Bands sharing only an endpoint do not overlap (half-open
        intervals). `time_to` at or before `time_from` means the band runs past midnight.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/CourtID"}
        - {$ref: "#/components/parameters/IfMatchVersion"}
      responses:
        "200":
          description: The updated price bands.
          content:
            application/json:
              schema:
                type: object
                required: [prices]
                properties:
                  prices:
                    type: array
                    items: {$ref: "#/components/schemas/CourtPrice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    The row version the client read before it edited. Same meaning as `If-Match`,
                    which wins where both are sent; omitting both is last-write-wins.
                prices:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [price, day_type, time_from, time_to]
                    properties:
                      price: {type: integer, minimum: 1, description: "Centavos ARS per hour."}
                      day_type: {$ref: "#/components/schemas/Weekday"}
                      time_from: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                      time_to: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}

  /api/v1/complexes/{id}/courts/{courtID}/block:
    post:
      tags: [courts]
      operationId: courtsBlockSlot
      summary: Block a time range on a court
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/CourtID"}
      responses:
        "201":
          description: The created blocked slot.
          content:
            application/json:
              schema:
                type: object
                required: [blocked_slot]
                properties:
                  blocked_slot: {$ref: "#/components/schemas/BlockedSlot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The range overlaps an existing booking, or is already blocked.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, start_time, end_time]
              properties:
                date: {type: string, format: date}
                start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                end_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
                reason: {type: string, maxLength: 500}

  /api/v1/complexes/{id}/blocked-slots:
    get:
      tags: [courts]
      operationId: courtsListBlockedSlots
      summary: List blocked slots in a date range
      description: The range is capped at 366 days.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: date_from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: date_to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Blocked slots in range, never `null`.
          content:
            application/json:
              schema:
                type: object
                required: [blocked_slots]
                properties:
                  blocked_slots:
                    type: array
                    items: {$ref: "#/components/schemas/BlockedSlot"}
        "400":
          description: Missing or malformed dates, `date_to` before `date_from`, or a range over 366 days.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/blocked-slots/{slotID}:
    delete:
      tags: [courts]
      operationId: courtsDeleteBlockedSlot
      summary: Remove a blocked slot
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: slotID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, example: "blocked slot deleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # health
  # ---------------------------------------------------------------------
  /api/v1/livez:
    get:
      tags: [health]
      operationId: livenessCheck
      summary: Liveness probe
      description: >-
        Public. Answers `200` for as long as the process is running, and touches no dependency.
        This is what a restart policy watches: an unreachable database must pull the instance out
        of rotation (see `/api/v1/healthcheck`), not restart every replica until the database
        comes back.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/v1/healthcheck:
    get:
      tags: [health]
      operationId: healthCheck
      summary: Readiness probe
      description: >-
        Public. Polled by the load balancer. `503` pulls the instance from rotation (database
        unreachable). A degraded cache or payments provider still answers `200` with
        `status: degraded`, so a payment-provider outage does not become a total outage.
      security: []
      responses:
        "200":
          description: Available, possibly degraded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}

  # ---------------------------------------------------------------------
  # leads
  # ---------------------------------------------------------------------
  /api/v1/public/leads/abandoned-registration:
    post:
      tags: [leads]
      operationId: leadsCaptureAbandonedRegistration
      summary: Capture an email from a registration that was started but never finished
      description: >-
        Public. Designed to be called via `navigator.sendBeacon`. Covers the password register
        form (an address typed before submitting) and the Google sign-up second step (an address
        Google verified, left before the phone number was given); `source` says which. The only
        endpoint in the API with an empty success body, no envelope at all. Downstream forwarding
        failures are logged, never surfaced.
      security: []
      responses:
        "202":
          description: Accepted, empty body.
        "400":
          description: Malformed JSON body.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
                source:
                  type: string
                  enum: [register, google]
                  default: register
                  description: Which form was abandoned; it decides the row's origin in the spreadsheet.
                first_name:
                  type: string
                  maxLength: 100
                  description: As far as the person got; forwarded as typed.
                last_name:
                  type: string
                  maxLength: 100
                  description: As far as the person got; forwarded as typed.
                phone:
                  type: string
                  maxLength: 32
                  description: As far as the person got; not validated as a phone number.

  # ---------------------------------------------------------------------
  # payments
  # ---------------------------------------------------------------------
  /api/v1/webhooks/mercadopago:
    post:
      tags: [payments]
      operationId: paymentsMercadoPagoWebhook
      summary: Receive a MercadoPago IPN notification
      description: >-
        Public, not rate limited. Cross-tenant bypass reason `resolves` (the tenant is found
        from the payment's external reference). Signature verified via the `x-signature` and
        `x-request-id` headers before the body is parsed or trusted. An unsigned or invalid
        request gets a bare `200` with nothing recorded, so MercadoPago stops retrying an
        attack while nothing is trusted. A recording failure answers `5xx` so MercadoPago
        redelivers; an oversized body is dropped with `200` since redelivery cannot fix it.
      security: []
      parameters:
        - name: x-signature
          in: header
          required: true
          schema: {type: string}
        - name: x-request-id
          in: header
          required: true
          schema: {type: string}
        - name: data.id
          in: query
          description: MercadoPago's own signature covers this parameter, preferred over the body field when present.
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, action, data]
              properties:
                type: {type: string}
                action: {type: string}
                data:
                  type: object
                  properties:
                    id:
                      description: Arrives as either a JSON string or a JSON number.
      responses:
        "200":
          description: Recorded, or dropped after signature or size rejection. Always empty body.
        "500":
          description: Recording the event failed. MercadoPago will redeliver.
        "503":
          description: Recording the event failed. MercadoPago will redeliver.

  # ---------------------------------------------------------------------
  # places
  # ---------------------------------------------------------------------
  /api/v1/places/autocomplete:
    get:
      tags: [places]
      operationId: placesAutocomplete
      summary: Google Places Autocomplete proxy
      description: >-
        An `input` under 3 characters short-circuits to an empty result without calling Google,
        since the call is billable.
      security: [{cookieAuth: []}]
      parameters:
        - name: input
          in: query
          required: true
          schema: {type: string}
        - name: session_token
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Google's Autocomplete predictions, passed through unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [predictions]
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Upstream reported the input could not be resolved.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429":
          description: >-
            Either this API's own rate limit, or Google Places' quota exhausted (the platform's
            own quota, surfaced as 429 because backing off is the only useful response either way).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "502":
          description: >-
            The upstream call failed for any other reason (a 5xx, a bad key, an unreadable
            body). Reported as a gateway failure rather than naming Google.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /api/v1/places/details:
    get:
      tags: [places]
      operationId: placesDetails
      summary: Google Places Details proxy, flattened to an address
      description: A hand-flattened projection of Google's response, not a passthrough.
      security: [{cookieAuth: []}]
      parameters:
        - name: place_id
          in: query
          required: true
          schema: {type: string}
        - name: session_token
          in: query
          schema: {type: string}
      responses:
        "200":
          description: The resolved address.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlaceDetails"}
        "400":
          description: Missing `place_id`.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown `place_id`.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429":
          description: This API's own rate limit, or Google Places' quota exhausted.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "502":
          description: The upstream call failed for any other reason.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  # ---------------------------------------------------------------------
  # products
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/products:
    get:
      tags: [products]
      operationId: productsList
      summary: List this complex's product catalog
      description: >-
        Unpaginated (a shop's catalog is bounded). Each product carries a computed `low_stock`
        flag (tracks_stock, a threshold is set, and stock is at or below it) and
        `needs_stock_review` (stock went below zero).
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ActiveFilter"}
      responses:
        "200":
          description: Every matching product.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: "#/components/schemas/Product"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [products]
      operationId: productsCreate
      summary: Add a product to the catalog
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The created product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: {$ref: "#/components/schemas/Product"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: {type: string, maxLength: 120}
                category: {type: string, maxLength: 60}
                price:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 2000000000
                  description: >-
                    Centavos ARS. Nullable only so a request that omits it decodes to a Go nil
                    rather than a valid-looking 0 — the request validator that would otherwise
                    catch a missing required field never runs in production
                    (internal/middleware/openapi.go), so the handler is the only place this is
                    actually enforced.
                tracks_stock: {type: boolean, default: true}
                low_stock_threshold: {type: integer, minimum: 0}

  /api/v1/complexes/{id}/products/{productID}:
    get:
      tags: [products]
      operationId: productsGet
      summary: Get one product
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ProductID"}
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: {$ref: "#/components/schemas/Product"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    patch:
      tags: [products]
      operationId: productsUpdate
      summary: Update a product
      description: >-
        Every field is optional; an omitted one keeps its current value. Sending `category` as
        an empty string clears it. Turning `tracks_stock` off while `stock_on_hand` is not zero
        is refused with 409 — adjust the count to zero first.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ProductID"}
        - {$ref: "#/components/parameters/IfMatchVersion"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The updated product.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: {$ref: "#/components/schemas/Product"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EditConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                  description: >-
                    The row version the client read before it edited. Same meaning as `If-Match`,
                    which wins where both are sent; omitting both is last-write-wins.
                name: {type: string, maxLength: 120}
                category: {type: string, maxLength: 60}
                price: {type: integer, minimum: 0, maximum: 2000000000}
                low_stock_threshold: {type: integer, minimum: 0}
                active: {type: boolean}
                tracks_stock: {type: boolean}

  /api/v1/complexes/{id}/products/{productID}/restock:
    post:
      tags: [products]
      operationId: productsRestock
      summary: Record a stock delivery
      description: >-
        Requires an open cash session (409 otherwise). In one transaction, writes the `restock`
        cash expense (amount = total_cost) and the linked stock movement, and applies the
        delivered quantity to `stock_on_hand`. Refused with 409 for a product that is inactive
        or does not track stock.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ProductID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The updated product and the recorded stock movement.
          content:
            application/json:
              schema:
                type: object
                required: [product, stock_movement]
                properties:
                  product: {$ref: "#/components/schemas/Product"}
                  stock_movement: {$ref: "#/components/schemas/StockMovement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            No cash session is open, the product is not active, or the product does not track
            stock.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, total_cost, method]
              properties:
                quantity:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 100000
                  description: Nullable for the same missing-vs-zero reason productsCreate's price is.
                total_cost:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2000000000
                  description: >-
                    Centavos ARS. A free restock is an adjustment, not a restock, so this is at
                    least 1. Nullable for the same reason quantity is.
                method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
                note: {type: string, maxLength: 500}

  /api/v1/complexes/{id}/products/{productID}/adjustments:
    post:
      tags: [products]
      operationId: productsAdjust
      summary: Correct a product's stock by hand
      description: >-
        No money involved, no cash session required. Refused with 409 for a product that does
        not track stock. Stock may go negative — an owner may adjust past zero on purpose (a
        recount that finds less than the system expects).
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ProductID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The updated product and the recorded stock movement.
          content:
            application/json:
              schema:
                type: object
                required: [product, stock_movement]
                properties:
                  product: {$ref: "#/components/schemas/Product"}
                  stock_movement: {$ref: "#/components/schemas/StockMovement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The product does not track stock.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, reason]
              properties:
                quantity:
                  type: [integer, "null"]
                  minimum: -100000
                  maximum: 100000
                  description: >-
                    Signed, non-zero: negative removes stock, positive adds it. Nullable for the
                    same missing-vs-zero reason productsCreate's price is (zero itself is refused
                    by the handler as not a real adjustment, so nullability only protects the
                    already-invalid value 0 from being confused with "not sent").
                reason: {type: string, enum: [breakage, expired, own_consumption, count_correction, other]}
                note: {type: string, maxLength: 500}

  /api/v1/complexes/{id}/products/{productID}/stock-movements:
    get:
      tags: [products]
      operationId: productsListStockMovements
      summary: A product's stock-movement history
      description: Newest first. Paginated.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ProductID"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of this product's stock movements.
          content:
            application/json:
              schema:
                type: object
                required: [stock_movements, metadata]
                properties:
                  stock_movements:
                    type: array
                    items: {$ref: "#/components/schemas/StockMovement"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Invalid cursor value.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # sales
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/sales:
    get:
      tags: [sales]
      operationId: salesList
      summary: List this complex's sales
      description: Newest first. Paginated. Optionally restricted to one cash session.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SaleSessionIDFilter"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of this complex's sales, each with its items.
          content:
            application/json:
              schema:
                type: object
                required: [sales, metadata]
                properties:
                  sales:
                    type: array
                    items: {$ref: "#/components/schemas/Sale"}
                  metadata: {$ref: "#/components/schemas/Metadata"}
        "400":
          description: Invalid cursor value.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      tags: [sales]
      operationId: salesCreate
      summary: Sell a set of products
      description: >-
        The client sends product ids and quantities only; prices and the total always come from
        the server. Requires an open cash session (409 otherwise). In one transaction: writes the
        'sale' cash income (amount = total), the sale and its items, and one 'sale' stock
        movement per tracked item. Never refused for lack of stock — the response's
        `stock_warnings` names every tracked product that ended at zero or below. 1 to 50 items;
        each product id may appear once (422 on a duplicate); every product must exist in this
        complex and be active, or the request is refused with 422 naming the offending item's
        index (`items[N].product_id`); the computed total must be greater than zero (a sale where
        every priced item is free is refused, not silently recorded as a zero-amount income) and
        must not exceed 2000000000 centavos.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The recorded sale, its items, and any stock warnings.
          content:
            application/json:
              schema:
                type: object
                required: [sale, stock_warnings]
                properties:
                  sale: {$ref: "#/components/schemas/Sale"}
                  stock_warnings:
                    type: array
                    items: {$ref: "#/components/schemas/SaleStockWarning"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No cash session is open.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, method]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: {type: string, format: uuid}
                      quantity:
                        type: [integer, "null"]
                        minimum: 1
                        maximum: 1000
                        description: Nullable for the same missing-vs-zero reason productsCreate's price is.
                method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
                note: {type: string, maxLength: 500, description: "Appended to the sale income movement's own note."}

  /api/v1/complexes/{id}/sales/{saleID}:
    get:
      tags: [sales]
      operationId: salesGet
      summary: Get one sale
      description: Includes its items.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SaleID"}
      responses:
        "200":
          description: The sale and its items.
          content:
            application/json:
              schema:
                type: object
                required: [sale]
                properties:
                  sale: {$ref: "#/components/schemas/Sale"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/sales/{saleID}/void:
    post:
      tags: [sales]
      operationId: salesVoid
      summary: Void a sale
      description: >-
        Once only (409 on a second void). Requires an open cash session (409 otherwise): the
        void's own cash movement always lands in whichever session is open right now, which may
        not be the sale's own. In one transaction: restores stock for every tracked item this
        sale originally moved (even if the product is now inactive or no longer tracks stock),
        and voids the sale's own income movement (opposite kind, same amount/method/category,
        landing in the currently open session) — the same shape cashMovementsVoid gives an
        ordinary cash movement. A 'sale' category income movement can only be voided through this
        endpoint, never through cashMovementsVoid directly.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/SaleID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The voided sale.
          content:
            application/json:
              schema:
                type: object
                required: [sale]
                properties:
                  sale: {$ref: "#/components/schemas/Sale"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: No cash session is open, or this sale has already been voided.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}

  # ---------------------------------------------------------------------
  # publicsite
  # ---------------------------------------------------------------------
  /api/v1/sitemap.xml:
    get:
      tags: [publicsite]
      operationId: publicsiteSitemap
      summary: Platform sitemap
      description: >-
        Public. Cross-tenant bypass reason `platform` (every active slug on the platform,
        by definition). One `<url>` per active complex slug.
      security: []
      responses:
        "200":
          description: XML sitemap.
          headers:
            Cache-Control:
              schema: {type: string, example: "public, max-age=3600"}
          content:
            application/xml:
              schema: {type: string}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/sitemap.xml:
    get:
      tags: [publicsite]
      operationId: publicsiteSitemapMoved
      summary: Platform sitemap (moved)
      description: >-
        Public. The pre-versioning address of the sitemap, kept as a permanent redirect
        because search engines hold it in their index and answer a 404 by dropping the
        pages it lists. Use `/api/v1/sitemap.xml`.
      security: []
      responses:
        "301":
          description: Moved permanently to `/api/v1/sitemap.xml`.
          headers:
            Location:
              schema: {type: string, example: "/api/v1/sitemap.xml"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/v1/public/prerender/{slug}:
    get:
      tags: [publicsite]
      operationId: publicsitePrerender
      summary: Server-rendered HTML for crawlers
      description: >-
        Public. Cross-tenant bypass reason `resolves`. The frontend's `index.html`, cached 10
        minutes server-side, with title, description, OpenGraph tags, canonical link and JSON-LD
        substituted in for this complex. All interpolated values are HTML-escaped.
      security: []
      parameters:
        - {$ref: "#/components/parameters/PathSlug"}
      responses:
        "200":
          description: Prerendered HTML.
          headers:
            Cache-Control:
              schema: {type: string, example: "public, max-age=300, stale-while-revalidate=60"}
          content:
            text/html:
              schema: {type: string}
        "404":
          description: Unknown slug, or the complex is inactive.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # realtime
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/events:
    get:
      tags: [realtime]
      operationId: realtimeStream
      summary: Live booking-change feed for the owner dashboard (Server-Sent Events)
      description: >-
        Not a conventional JSON endpoint. The connection opens with `event: connected`, then a
        `: keepalive` comment every 30 seconds, then `event: booking_changed` with an empty
        `data: {}` payload whenever a booking on this complex is created, updated, cancelled or
        paid (the dashboard reacts by refetching rather than reading the event body). The
        stream ends with one of two terminal frames before closing: `event: expired` after 15
        minutes (matching the access-token lifetime) or two consecutive re-authorization
        failures, or `event: unauthorized` when a re-check (every 60 seconds) finds the caller
        no longer authorized. Admission may refuse before any header is written when the
        per-complex or global subscriber cap is hit.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: >-
            An open `text/event-stream` connection. See the description for the frame protocol
            and the event catalogue (`connected`, `booking_changed`, `expired`, `unauthorized`).
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-Sent Events frames. Not representable as discrete JSON responses, see
                  the operation description for the full protocol.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429":
          description: The per-complex or global subscriber cap was reached. The connection was never upgraded.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "500": {$ref: "#/components/responses/ServerError"}

  # ---------------------------------------------------------------------
  # reporting
  # ---------------------------------------------------------------------
  /api/v1/complexes/{id}/stats:
    get:
      tags: [reporting]
      operationId: reportingGetDashboardStats
      summary: Dashboard summary statistics
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Today's, yesterday's and this month's figures.
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats: {$ref: "#/components/schemas/DashboardStats"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/stats/revenue:
    get:
      tags: [reporting]
      operationId: reportingGetRevenueChart
      summary: Daily revenue chart
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: period
          in: query
          schema: {type: string, enum: [week, month], default: week}
      responses:
        "200":
          description: One point per day.
          content:
            application/json:
              schema:
                type: object
                required: [revenue]
                properties:
                  revenue:
                    type: array
                    items: {$ref: "#/components/schemas/RevenueDataPoint"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/stats/occupancy:
    get:
      tags: [reporting]
      operationId: reportingGetOccupancyChart
      summary: Occupancy heatmap by day of week and hour
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: weeks
          in: query
          schema: {type: integer, default: 4, minimum: 1, maximum: 12}
      responses:
        "200":
          description: Occupancy percentage per day-of-week/hour cell.
          content:
            application/json:
              schema:
                type: object
                required: [occupancy]
                properties:
                  occupancy:
                    type: array
                    items: {$ref: "#/components/schemas/OccupancyPoint"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/stats/clients:
    get:
      tags: [reporting]
      operationId: reportingGetClientInsights
      summary: Client retention and frequency panel
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      responses:
        "200":
          description: Retention and frequency figures.
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients: {$ref: "#/components/schemas/ClientInsights"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/reports/monthly:
    get:
      tags: [reporting]
      operationId: reportingGetMonthlyReport
      summary: Monthly payments report
      description: >-
        Defaults to the current month and year in the Argentina timezone. Period validation
        errors answer `400` with the bare machine code string as the `error` value (not an
        object), unlike the field-validation convention used elsewhere in the API.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: month
          in: query
          schema: {type: integer, minimum: 1, maximum: 12}
        - name: year
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: The monthly report.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: {$ref: "#/components/schemas/MonthlyReport"}
        "400":
          description: >-
            `month_out_of_range`, `report_period_in_future` or
            `report_period_before_complex_existed`, as the bare `error` string.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/v1/complexes/{id}/reports/export:
    get:
      tags: [reporting]
      operationId: reportingExportPaymentsExcel
      summary: Download the monthly payments report as an Excel workbook
      deprecated: true
      description: >-
        Same period parameters and validation as the monthly report. Bounded by an 8 second
        budget and a 50,000 row cap.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - name: month
          in: query
          schema: {type: integer, minimum: 1, maximum: 12}
        - name: year
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: A two-sheet Excel workbook (payment detail plus a summary sheet).
          headers:
            Content-Disposition:
              schema: {type: string, example: 'attachment; filename="pagos_mi-complejo_9_2026.xlsx"'}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "400":
          description: Period validation failed, same machine-code shape as the monthly report.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: The report exceeds the 50,000 row export cap (`report_export_too_large`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: The export did not finish inside its budget (`report_export_timed_out`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /api/v1/complexes/{id}/reports/exports:
    post:
      tags: [reporting]
      operationId: reportingCreatePaymentsExport
      summary: Start a payments export job
      description: >-
        Enqueues the Excel export and answers immediately. Deduplicated per complex, period
        and calendar day (Argentina), so a double click yields the same export id. Poll the
        status resource in `status_url` until `status` is `done` or `failed`.
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                month: {type: integer, minimum: 1, maximum: 12}
                year: {type: integer}
      responses:
        "202":
          description: The export was accepted, or an identical one was already queued.
          headers:
            Location:
              schema: {type: string, example: "/api/v1/complexes/0f.../reports/exports/8a..."}
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export:
                    type: object
                    required: [id, status, status_url]
                    properties:
                      id: {type: string, format: uuid}
                      status: {type: string, enum: [pending, running, done, failed]}
                      status_url: {type: string}
        "400":
          description: Period validation failed, same machine-code shape as the monthly report.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "501":
          description: No object storage backend is configured for exports.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /api/v1/complexes/{id}/reports/exports/{exportID}:
    get:
      tags: [reporting]
      operationId: reportingGetPaymentsExport
      summary: Payments export status and download URL
      description: >-
        `download_url` and `expires_at` are present only when `status` is `done`; the URL is a
        short-lived signed link to private object storage. A failed export answers `200` with
        `status: failed` and an embedded `error` problem whose `instance` is this path.
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/PathID"}
        - {$ref: "#/components/parameters/ExportID"}
      responses:
        "200":
          description: The export's current state.
          content:
            application/json:
              schema:
                type: object
                required: [export]
                properties:
                  export: {$ref: "#/components/schemas/PaymentsExport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410":
          description: The file has passed its 24 hour retention (`export_expired`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/ServerError"}
        "501":
          description: No object storage backend is configured for exports.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  # ---------------------------------------------------------------------
  # openapi
  # ---------------------------------------------------------------------
  /api/v1/openapi.json:
    get:
      tags: [openapi]
      operationId: openapiGetJSON
      summary: This document, rendered as JSON
      description: Public. General rate-limit tier. Rendered from the same parsed document served as YAML and used by /docs.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema: {type: object}
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/v1/openapi.yaml:
    get:
      tags: [openapi]
      operationId: openapiGetYAML
      summary: This document, as raw YAML bytes
      description: Public. General rate-limit tier. The source of truth committed to the repository at internal/openapi/openapi.yaml.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
        "429": {$ref: "#/components/responses/RateLimited"}

  /api/v1/docs:
    get:
      tags: [openapi]
      operationId: openapiGetDocs
      summary: Interactive API reference
      description: >-
        Public. General rate-limit tier. An HTML page that loads Scalar's API reference pointed
        at /api/v1/openapi.json. Not intended for search indexing, answers `X-Robots-Tag: noindex`.
      security: []
      responses:
        "200":
          description: The documentation page.
          headers:
            X-Robots-Tag:
              schema: {type: string, example: "noindex"}
            Cache-Control:
              schema: {type: string, example: "public, max-age=3600"}
          content:
            text/html:
              schema: {type: string}
        "429": {$ref: "#/components/responses/RateLimited"}

  /.well-known/api-catalog:
    get:
      tags: [openapi]
      operationId: openapiGetCatalog
      summary: RFC 9727 API catalog
      description: >-
        Public. General rate-limit tier. A linkset pointing an agent at this API's machine-readable
        description, interactive reference and health check, without requiring it to already know
        this API's URLs. Derived at boot from this same document's `servers` list and paths, so it
        cannot point at a route this API does not serve. The landing site publishes an equivalent
        copy at https://vibe.com.ar/.well-known/api-catalog, derived from the same document.
      security: []
      responses:
        "200":
          description: The API catalog, as a linkset.
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string, example: "*"}
          content:
            application/linkset+json:
              schema: {type: object}
        "429": {$ref: "#/components/responses/RateLimited"}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >-
        A 15 minute HS256 JWT set as an HttpOnly, Secure (outside development), SameSite=Lax
        cookie by login, register (in development) and refresh. Every private route resolves
        the caller from this cookie, falling back to an `Authorization: Bearer <token>` header
        when the cookie is absent.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required on every state-changing request that carries a session, except the routes
        listed as CSRF-exempt in the description of this document. The value is returned as
        `csrf_token` in the JSON body of a successful login or refresh call, and is validated as
        an HMAC-SHA256 of the current access token.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous page's `metadata.next_cursor`.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size. Default 50, maximum 200.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    PathID:
      name: id
      in: path
      required: true
      description: Complex id.
      schema: {type: string, format: uuid}
    PathSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    BookingID:
      name: bookingID
      in: path
      required: true
      schema: {type: string, format: uuid}
    CourtID:
      name: courtID
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionID:
      name: sessionID
      in: path
      required: true
      description: Cash session id.
      schema: {type: string, format: uuid}
    MovementID:
      name: movementID
      in: path
      required: true
      description: Cash movement id.
      schema: {type: string, format: uuid}
    ProductID:
      name: productID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActiveFilter:
      name: active
      in: query
      description: Restrict the list to active or inactive products. Omit to return both.
      schema: {type: boolean}
    SaleID:
      name: saleID
      in: path
      required: true
      description: Sale id.
      schema: {type: string, format: uuid}
    SaleSessionIDFilter:
      name: session_id
      in: query
      description: Restrict the list to sales recorded against this cash session. Omit to return every session's.
      schema: {type: string, format: uuid}
    ClientID:
      name: clientID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExportID:
      name: exportID
      in: path
      required: true
      schema: {type: string, format: uuid}
    BookingToken:
      name: token
      in: query
      required: true
      description: The opaque booking-link token, never the booking's primary key.
      schema: {type: string}
    IfMatchVersion:
      name: If-Match
      in: header
      required: false
      description: >-
        The row version the client read before it edited, as an entity tag — `If-Match: "3"`.
        The write is refused with 409 if the row moved since. A `version` field in the body means
        the same thing, and this header wins where both are sent. `*`, or neither, is
        last-write-wins: unchanged behaviour for a client that has not adopted this.
      schema: {type: string, example: "\"3\""}

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key the caller chooses to identify this attempt. Send the same key when retrying and
        the first answer is replayed verbatim, marked with `Idempotent-Replay: true`, instead of
        the request running twice — which is what a retried booking needs, because the database
        would otherwise refuse the retry as somebody else's slot. The same key with a different
        body, path or caller answers 409, as does a repeat arriving while the first is still
        running. Records are kept for 24 hours. Omitting the header is unchanged behaviour.
      schema: {type: string, maxLength: 64, pattern: "^[!-~]+$", example: "9d1d1f4e-0a0a-4a4a-8b8b-000000000001"}

  responses:
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Authenticated, but not permitted to reach this resource.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: The requested resource could not be found.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ValidationError:
      description: One or more fields failed validation.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: Too many requests. See the `Retry-After` header.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServerError:
      description: An unexpected server error. The message is always generic, it never leaks internal detail.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    EditConflict:
      description: A concurrent edit was detected. Retry the request.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    LinkExpired:
      description: The booking link has expired.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    GoogleSignInResult:
      description: >-
        The outcome of a verified Google sign-in: a session established exactly as `/auth/login`
        does, or a profile token for an address with no account yet. `/auth/google` and
        `/auth/google/exchange` answer identically — the second is the redirect-mode path to the
        same place.
      headers:
        Set-Cookie:
          description: Sets `access_token` and `refresh_token`, only when a session was established.
          schema: {type: string}
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [user, csrf_token]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token:
                    type: string
                    description: Send this back as the `X-CSRF-Token` header on subsequent mutating requests.
              - type: object
                required: [needs_profile, profile_token, profile]
                properties:
                  needs_profile: {type: boolean, enum: [true]}
                  profile_token:
                    type: string
                    description: Signed, 10-minute token. Send back to `/auth/google/complete`.
                  profile:
                    type: object
                    required: [email, first_name, last_name]
                    properties:
                      email: {type: string}
                      first_name: {type: string}
                      last_name: {type: string}

  schemas:
    Problem:
      type: object
      description: >-
        An RFC 9457 problem detail. Every 4xx/5xx response uses this shape
        (`Content-Type: application/problem+json`). The frontend switches on
        `type`; `title`/`detail` are for humans and may change wording.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >-
            A stable URI identifying this problem's kind, e.g.
            `https://vibe.com.ar/problems/validation`.
        title:
          type: string
          description: A short, stable summary of this problem's type.
        status:
          type: integer
          description: The HTTP status code, repeated here per RFC 9457.
        detail:
          type: string
          description: Human readable detail for this occurrence, safe to display.
        instance:
          type: string
          description: The request path that produced this problem.
        request_id:
          type: string
          description: Correlates this response with the server's logs.
        errors:
          type: array
          description: Present on a validation problem; one entry per invalid field.
          items: {$ref: "#/components/schemas/FieldError"}

    PaymentsExport:
      type: object
      description: >-
        One payments export job. `download_url`/`expires_at` appear only on `done`; `error`
        only on `failed`.
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, done, failed]}
        download_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        error: {$ref: "#/components/schemas/Problem"}

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: >-
            Dotted or bracketed for nested fields, e.g. `schedules[3].open_time`.
        message:
          type: string
          description: >-
            Free text, or one of the stable machine codes intended for
            frontend-localized copy (`slug_taken`, `deposit_percentage_over_100`,
            `deposit_exceeds_price`, `month_out_of_range`, `report_period_in_future`,
            `report_period_before_complex_existed`, `report_export_too_large`,
            `report_export_timed_out`, `price_required`).

    Metadata:
      type: object
      required: [has_more]
      properties:
        next_cursor: {type: string}
        has_more: {type: boolean}
        total_count: {type: integer}

    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    BookingStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed, no_show]

    CollectionStatus:
      type: string
      enum: [unpaid, deposit_paid, fully_paid]

    RefundStatus:
      type: string
      description: "`partial` is set only by the system, never accepted as client input."
      enum: [none, pending, partial, full]

    User:
      type: object
      required: [id, email, first_name, last_name, phone, role, is_active, email_verified, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        phone: {type: string, example: "+5491112345678"}
        role: {type: string, enum: [owner, client, superadmin]}
        is_active: {type: boolean}
        email_verified: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Complex:
      type: object
      required:
        [id, owner_id, name, slug, address, city, province, country_code, currency, phone,
         deposit_percentage, cancellation_hours, is_active, amenities, payments_enabled,
         version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        address: {type: string}
        city: {type: string}
        province: {type: string}
        country_code: {type: string, example: "AR"}
        currency: {type: string, example: "ARS"}
        phone: {type: string, example: "+5491112345678"}
        email: {type: [string, "null"]}
        logo_url: {type: [string, "null"], format: uri}
        cover_url: {type: [string, "null"], format: uri}
        deposit_percentage: {type: integer, minimum: 0, maximum: 100}
        cancellation_hours: {type: integer, minimum: 1, maximum: 168}
        latitude: {type: [number, "null"], format: double}
        longitude: {type: [number, "null"], format: double}
        is_active: {type: boolean}
        amenities:
          type: array
          items: {type: string}
        court_count:
          type: integer
          description: Present only when returned by the owner's complex-list query.
        payments_enabled: {type: boolean}
        mp_user_id: {type: [string, "null"]}
        mp_token_expires_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, description: "Optimistic-concurrency counter, bumped on every update."}

    PublicComplex:
      type: object
      description: >-
        The storefront projection of a Complex. Excludes `owner_id` and `mp_user_id`; adds
        `payments_enabled` derived from the connection state.
      required:
        [id, name, slug, address, city, province, country_code, currency, phone,
         deposit_percentage, cancellation_hours, amenities, payments_enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        address: {type: string}
        city: {type: string}
        province: {type: string}
        country_code: {type: string, example: "AR"}
        currency: {type: string, example: "ARS"}
        phone: {type: string}
        email: {type: string}
        logo_url: {type: string, format: uri}
        cover_url: {type: string, format: uri}
        deposit_percentage: {type: integer}
        cancellation_hours: {type: integer}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        amenities:
          type: array
          items: {type: string}
        payments_enabled: {type: boolean}
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency counter, bumped on every write. Echo it back on a PUT — as
            `If-Match: "<version>"` or as a `version` body field — and the write is refused with
            409 if anybody else changed the row meanwhile. Omitting it is last-write-wins.

    Schedule:
      type: object
      required: [id, complex_id, day, open_time, close_time, is_closed]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        day: {$ref: "#/components/schemas/Weekday"}
        open_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        close_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        is_closed: {type: boolean}

    Court:
      type: object
      required: [id, complex_id, name, sport, court_type, is_active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        name: {type: string}
        sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
        court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
        is_active: {type: boolean}
        description: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency counter, bumped on every write. Echo it back on a PUT — as
            `If-Match: "<version>"` or as a `version` body field — and the write is refused with
            409 if anybody else changed the row meanwhile. Omitting it is last-write-wins.

    CourtWithPrices:
      allOf:
        - {$ref: "#/components/schemas/Court"}
        - type: object
          required: [prices]
          properties:
            prices:
              type: array
              items: {$ref: "#/components/schemas/CourtPrice"}

    CourtPrice:
      type: object
      required: [id, court_id, price, day_type, time_from, time_to]
      properties:
        id: {type: string, format: uuid}
        court_id: {type: string, format: uuid}
        price: {type: integer, description: "Centavos ARS per hour."}
        day_type: {$ref: "#/components/schemas/Weekday"}
        time_from: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        time_to:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: "At or before time_from means the band runs past midnight."
        from_min: {type: integer, description: Minutes from weekday midnight.}
        to_min: {type: integer, description: "Minutes from weekday midnight, may exceed 1440."}
        version:
          type: integer
          minimum: 1
          description: >-
            This band's own counter. The PUT that saves a court's price table is guarded by the
            COURT's version instead: these rows are replaced wholesale, so a band's counter does
            not survive the save.

    CashSession:
      type: object
      required: [id, complex_id, opened_at, opened_by, opening_cash, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        opened_at: {type: string, format: date-time}
        opened_by: {type: string, format: uuid}
        opening_cash: {type: integer, format: int64, description: "Centavos ARS. A session-level sum, not one entry — BIGINT (db/migrations/003_cashbox.sql)."}
        closed_at: {type: [string, "null"], format: date-time}
        closed_by: {type: [string, "null"], format: uuid}
        counted_cash:
          type: [integer, "null"]
          format: int64
          description: "Centavos ARS, physically counted. Null until closed."
        expected_cash:
          type: [integer, "null"]
          format: int64
          description: "Centavos ARS, the close-time snapshot. Null until closed."
        difference:
          type: [integer, "null"]
          format: int64
          description: "counted_cash minus expected_cash. Null until closed."
        opening_note:
          type: [string, "null"]
          description: Written once, by open. Never changed by close.
        closing_note:
          type: [string, "null"]
          description: Written once, by close. Never overwrites opening_note.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    CashMovement:
      type: object
      required: [id, complex_id, session_id, kind, category, method, amount, created_at, created_by]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        kind: {type: string, enum: [income, expense]}
        category:
          type: string
          enum: [other_income, supplies, salaries, services, maintenance, cleaning, withdrawal, other_expense]
        method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
        amount: {type: integer, description: "Centavos ARS."}
        note: {type: [string, "null"]}
        voids_movement_id:
          type: [string, "null"]
          format: uuid
          description: The movement this one corrects, when this row is a void.
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}

    CashMovementTotal:
      type: object
      description: One (method, kind, category) bucket's total within a session.
      required: [method, kind, category, total, count]
      properties:
        method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
        kind: {type: string, enum: [income, expense]}
        category: {type: string}
        total: {type: integer, description: "Centavos ARS."}
        count: {type: integer}

    CashBookingPaymentTotal:
      type: object
      description: >-
        One payment method's booking-payment total within the session's window. Informational
        for every method except cash, which also feeds expected_cash.
      required: [method, count, amount, service_fee, refunded]
      properties:
        method: {type: string, enum: [mercadopago, cash, transfer, debit_card, credit_card, qr_wallet]}
        count: {type: integer}
        amount: {type: integer, description: "Centavos ARS."}
        service_fee: {type: integer, description: "Centavos ARS."}
        refunded: {type: integer, description: "Centavos ARS."}

    CashSessionSummary:
      type: object
      required: [opening_cash, expected_cash, movement_totals, booking_payments]
      properties:
        opening_cash: {type: integer, format: int64, description: "Centavos ARS."}
        expected_cash:
          type: integer
          format: int64
          description: >-
            Live projection through now() for an open session; the exact close-time snapshot for
            a closed one.
        counted_cash:
          type: [integer, "null"]
          format: int64
          description: "Centavos ARS. Present only when closed."
        difference:
          type: [integer, "null"]
          format: int64
          description: "Centavos ARS. Present only when closed."
        movement_totals:
          type: array
          items: {$ref: "#/components/schemas/CashMovementTotal"}
        booking_payments:
          type: array
          items: {$ref: "#/components/schemas/CashBookingPaymentTotal"}

    Product:
      type: object
      required:
        [id, complex_id, name, price, tracks_stock, stock_on_hand, active, low_stock, needs_stock_review,
         created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        name: {type: string}
        category: {type: [string, "null"], description: "Free text, owner-defined (e.g. \"Bebidas\")."}
        price: {type: integer, description: "Centavos ARS."}
        tracks_stock: {type: boolean}
        stock_on_hand:
          type: integer
          description: >-
            May be negative: selling (T4b) or adjusting past zero is allowed, and a negative
            value is exactly what needs_stock_review flags.
        low_stock_threshold: {type: [integer, "null"]}
        active: {type: boolean, description: "A product is deactivated, never deleted."}
        low_stock:
          type: boolean
          description: "Computed: tracks_stock && low_stock_threshold is set && stock_on_hand <= low_stock_threshold."
        needs_stock_review:
          type: boolean
          description: "Computed: stock_on_hand < 0."
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency counter, bumped on every write. Echo it back on a PATCH — as
            `If-Match: "<version>"` or as a `version` body field — and the write is refused with
            409 if anybody else changed the row meanwhile. Omitting it is last-write-wins.

    StockMovement:
      type: object
      required: [id, complex_id, product_id, kind, quantity, created_at, created_by]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        kind: {type: string, enum: [sale, restock, adjustment, sale_void]}
        quantity:
          type: integer
          description: "Signed. Negative removes stock, positive adds it — see StockMovement's own CHECK by kind."
        reason:
          type: [string, "null"]
          enum: [breakage, expired, own_consumption, count_correction, other, null]
          description: "Set iff kind = adjustment."
        note: {type: [string, "null"]}
        cash_movement_id:
          type: [string, "null"]
          format: uuid
          description: "The linked cash expense. Set iff kind = restock."
        sale_id:
          type: [string, "null"]
          format: uuid
          description: "Set iff kind = sale or sale_void."
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}

    Sale:
      type: object
      required:
        [id, complex_id, session_id, method, total, cash_movement_id, items, created_at, created_by]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        method: {type: string, enum: [cash, transfer, debit_card, credit_card, qr_wallet]}
        total: {type: integer, description: "Centavos ARS. Always the server-computed sum of the sale's own line totals."}
        cash_movement_id: {type: string, format: uuid, description: "The sale's own 'sale' category income movement."}
        voided_at: {type: [string, "null"], format: date-time}
        voided_by: {type: [string, "null"], format: uuid}
        void_cash_movement_id:
          type: [string, "null"]
          format: uuid
          description: "The movement that voided the sale's income, when this sale is voided."
        items:
          type: array
          items: {$ref: "#/components/schemas/SaleItem"}
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}

    SaleItem:
      type: object
      required: [id, complex_id, sale_id, product_id, product_name, unit_price, quantity, line_total]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        product_name: {type: string, description: "Snapshot of the product's name at sale time."}
        unit_price: {type: integer, description: "Centavos ARS, snapshot of the product's price at sale time."}
        quantity: {type: integer, minimum: 1, maximum: 1000}
        line_total: {type: integer, description: "unit_price * quantity."}

    SaleStockWarning:
      type: object
      description: >-
        One tracked product whose stock_on_hand ended at zero or below after the sale — never a
        reason the sale was refused (selling past zero stock is allowed), only a flag that it
        needs a count.
      required: [product_id, product_name, stock_on_hand]
      properties:
        product_id: {type: string, format: uuid}
        product_name: {type: string}
        stock_on_hand: {type: integer}

    BlockedSlot:
      type: object
      required: [id, court_id, date, start_time, end_time, created_at]
      properties:
        id: {type: string, format: uuid}
        court_id: {type: string, format: uuid}
        date: {type: string, format: date}
        start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        end_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        reason: {type: [string, "null"]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        court_name: {type: string, description: "Enrichment, present on list responses."}

    Client:
      type: object
      required: [id, complex_id, first_name, last_name, phone, is_blocked, total_bookings, no_shows, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        first_name: {type: string}
        last_name: {type: string}
        phone: {type: string, example: "+5491112345678"}
        email: {type: [string, "null"]}
        notes: {type: [string, "null"]}
        is_blocked: {type: boolean}
        total_bookings: {type: integer, description: "A live count, not a stored counter."}
        no_shows: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Booking:
      type: object
      required:
        [id, complex_id, court_id, client_id, starts_at, ends_at, date, start_time,
         duration_minutes, price, deposit_amount, status, collection_status, refund_status,
         reminder_sent_2h, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        court_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        date:
          type: string
          format: date-time
          description: >-
            Serializes as a full RFC 3339 timestamp, not a date-only string, when the struct is
            returned directly by this endpoint.
        start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        duration_minutes: {type: integer}
        price: {type: integer, description: "Centavos ARS."}
        deposit_amount: {type: integer, description: "Centavos ARS."}
        status: {$ref: "#/components/schemas/BookingStatus"}
        collection_status: {$ref: "#/components/schemas/CollectionStatus"}
        refund_status: {$ref: "#/components/schemas/RefundStatus"}
        reminder_sent_2h: {type: boolean}
        notes: {type: [string, "null"]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        court_name: {type: string, description: "Enrichment, present when joined."}
        client_name: {type: string, description: "Enrichment, present when joined."}
        client_phone: {type: string, description: "Enrichment, present when joined."}

    Payment:
      type: object
      required: [id, booking_id, complex_id, amount, service_fee, method, status, refund_amount, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        complex_id: {type: string, format: uuid}
        amount: {type: integer, description: "Centavos ARS."}
        service_fee: {type: integer, description: "Centavos ARS."}
        method: {type: string, enum: [mercadopago, cash, transfer, debit_card, credit_card, qr_wallet]}
        status:
          type: string
          description: >-
            The payments table's own, wider status vocabulary. Distinct from
            Booking.collection_status/refund_status, which were split off it at the booking level.
          enum: [unpaid, deposit_paid, fully_paid, refunded, refund_pending, partial_refund]
        mp_payment_id: {type: [string, "null"]}
        mp_preference_id: {type: [string, "null"]}
        refund_amount: {type: integer, description: "Centavos ARS."}
        status_detail: {type: [string, "null"], description: "MercadoPago's own status_detail string."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    RefundOutcome:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [none, not_eligible, issued, already_issued, queued, manual]
        message: {type: string, description: "Spanish, human-readable, safe to show a client."}
        amount: {type: integer, description: "Centavos ARS. Present only when greater than zero, the automatic-refund half."}
        manual_amount: {type: integer, description: "Centavos ARS. Present only when greater than zero, a balance nothing automatic can move."}
        manual_message: {type: string, description: Present only when manual_amount is.}

    PublicBookingResult:
      type: object
      required: [booking, token]
      properties:
        booking:
          type: object
          required:
            [status, collection_status, refund_status, date, start_time, starts_at, ends_at,
             court_name, complex_name, price, deposit_amount]
          properties:
            status: {$ref: "#/components/schemas/BookingStatus"}
            collection_status: {$ref: "#/components/schemas/CollectionStatus"}
            refund_status: {$ref: "#/components/schemas/RefundStatus"}
            date: {type: string, format: date}
            start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            court_name: {type: string}
            complex_name: {type: string}
            price: {type: integer, description: "Centavos ARS."}
            deposit_amount: {type: integer, description: "Centavos ARS."}
        token:
          type: string
          description: Opaque booking-link credential. The booking's primary key is never included.
        mp_init_point: {type: string, format: uri}
        mp_preference_id: {type: string}
        service_fee: {type: integer, description: "Centavos ARS."}
        total_client_pays: {type: integer, description: "Centavos ARS."}

    PublicBookingStatus:
      type: object
      required:
        [status, collection_status, refund_status, complex_name, complex_address, court_name,
         sport, court_type, date, start_time, starts_at, ends_at, duration_minutes, price,
         deposit_amount, service_fee, remaining_amount, cancellation]
      properties:
        status: {$ref: "#/components/schemas/BookingStatus"}
        collection_status: {$ref: "#/components/schemas/CollectionStatus"}
        refund_status: {$ref: "#/components/schemas/RefundStatus"}
        complex_name: {type: string}
        complex_address: {type: string}
        complex_phone: {type: string}
        court_name: {type: string}
        sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
        court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
        date: {type: string, format: date}
        start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        duration_minutes: {type: integer}
        price: {type: integer, description: "Centavos ARS."}
        deposit_amount: {type: integer, description: "Centavos ARS."}
        service_fee: {type: integer, description: "Centavos ARS."}
        remaining_amount: {type: integer, description: "Centavos ARS."}
        cancellation:
          type: object
          required: [can_cancel, can_refund_now, cancellation_hours]
          properties:
            can_cancel: {type: boolean}
            can_refund_now: {type: boolean}
            cancellation_hours: {type: integer}
            refund_deadline: {type: [string, "null"], format: date-time}

    PublicCancelInfo:
      type: object
      required: [booking, can_cancel, can_refund, refund_method, cancellation_hours, refund_amount, paid_amount]
      properties:
        booking:
          type: object
          required: [status, date, start_time, starts_at, ends_at, duration_minutes, court_name, sport, court_type, complex_name]
          properties:
            status: {$ref: "#/components/schemas/BookingStatus"}
            date: {type: string, format: date}
            start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            duration_minutes: {type: integer}
            court_name: {type: string}
            sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
            court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
            complex_name: {type: string}
            complex_address: {type: string}
        can_cancel: {type: boolean}
        can_refund: {type: boolean}
        refund_method: {type: string, enum: [mercadopago, manual, none]}
        cancellation_hours: {type: integer}
        refund_amount: {type: integer, description: "Centavos ARS."}
        paid_amount: {type: integer, description: "Centavos ARS."}

    SlugAvailability:
      type: object
      required: [slug, valid, available]
      properties:
        slug: {type: string}
        valid: {type: boolean}
        available: {type: boolean}
        suggestion:
          type: string
          description: Present only when the slug is taken and a free alternative was found.

    PlatformStats:
      type: object
      required:
        [total_users, active_users, new_users_month, total_complexes, new_complexes_month,
         total_courts, total_bookings, total_revenue]
      properties:
        total_users: {type: integer}
        active_users: {type: integer}
        new_users_month: {type: integer}
        total_complexes: {type: integer}
        new_complexes_month: {type: integer}
        total_courts: {type: integer}
        total_bookings: {type: integer}
        total_revenue: {type: integer, description: "Centavos ARS."}

    AdminUserRow:
      type: object
      required: [id, email, first_name, last_name, phone, role, is_active, email_verified, created_at, complex_count]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        phone: {type: string}
        role: {type: string, enum: [owner, client, superadmin]}
        is_active: {type: boolean}
        email_verified: {type: boolean}
        created_at: {type: string, format: date-time}
        complex_count: {type: integer}

    AdminComplexRow:
      type: object
      required: [id, owner_id, owner_name, owner_email, name, slug, city, is_active, mp_connected, courts_count, created_at]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        owner_name: {type: string}
        owner_email: {type: string}
        name: {type: string}
        slug: {type: string}
        city: {type: string}
        is_active: {type: boolean}
        mp_connected: {type: boolean}
        courts_count: {type: integer}
        created_at: {type: string, format: date-time}

    AuditLogRow:
      type: object
      description: Every pointer field lacks `omitempty` in Go, so an absent value serializes as JSON `null`, not as an absent key.
      required: [id, user_id, user_email, complex_id, action, entity_type, entity_id, ip_address, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: [string, "null"], format: uuid}
        user_email: {type: [string, "null"]}
        complex_id: {type: [string, "null"], format: uuid}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: [string, "null"], format: uuid}
        ip_address: {type: [string, "null"]}
        created_at: {type: string, format: date-time}

    Availability:
      type: object
      required: [date, day, is_open, courts]
      properties:
        date: {type: string, format: date}
        day: {$ref: "#/components/schemas/Weekday"}
        is_open: {type: boolean}
        courts:
          type: array
          items: {$ref: "#/components/schemas/AvailabilityCourt"}

    AvailabilityCourt:
      type: object
      required: [court_id, court_name, sport, court_type, slots]
      properties:
        court_id: {type: string, format: uuid}
        court_name: {type: string}
        sport: {type: string, enum: [padel, tennis, soccer, basketball, volleyball, hockey, pickleball]}
        court_type: {type: string, enum: [indoor, outdoor, semi_covered]}
        description: {type: string}
        slots:
          type: array
          items: {$ref: "#/components/schemas/AvailabilitySlot"}

    AvailabilitySlot:
      type: object
      required: [start_time, end_time, start_min, duration_minutes, price, available]
      properties:
        start_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        end_time: {type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"}
        start_min:
          type: integer
          description: Minutes from the window's midnight, unwrapped past 1440 for overnight venues so past-midnight slots sort correctly.
        duration_minutes: {type: integer}
        price: {type: integer, description: "Centavos ARS."}
        available: {type: boolean}

    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [available, degraded]}
        version: {type: string}
        impaired:
          type: array
          description: Present only when non-empty.
          items:
            type: string
            enum: [database, cache, payments]

    HealthDetailed:
      type: object
      required: [status, version, environment, dependencies]
      properties:
        status: {type: string, enum: [available, degraded]}
        version: {type: string}
        environment: {type: string}
        dependencies:
          type: object
          description: Dependency name to state, plus merged db_pool_*/redis_pool_* figures.
          additionalProperties: {type: string}
        impaired:
          type: array
          items: {type: string, enum: [database, cache, payments]}
        breakers:
          type: object
          description: "Per external dependency (mercadopago, whatsapp, mailer) to circuit state."
          additionalProperties: {type: string, enum: [closed, open, half-open]}
        metrics:
          type: object
          description: Process counters (request volume, latency, goroutines, notifier queue depths). Shape not fixed.
          additionalProperties: true
        queues:
          type: array
          items: {$ref: "#/components/schemas/QueueStats"}
        queues_error:
          type: string
          description: Present only when the queue-stats query itself failed. Does not fail the whole health check.

    QueueStats:
      type: object
      required: [name, pending, processing, exhausted, oldest_due_seconds]
      properties:
        name: {type: string, example: "webhook_events"}
        pending: {type: integer}
        processing: {type: integer}
        exhausted: {type: integer}
        oldest_due_seconds: {type: integer}

    PlaceDetails:
      type: object
      required: [address, city, province, formatted_address, latitude, longitude]
      properties:
        address: {type: string}
        city: {type: string}
        province: {type: string}
        formatted_address: {type: string}
        latitude: {type: string, description: 'Formatted with "%f", a string rather than a JSON number.'}
        longitude: {type: string, description: 'Formatted with "%f", a string rather than a JSON number.'}

    DashboardStats:
      type: object
      description: Built as an ad-hoc map in the handler, not a named Go struct.
      required:
        [today_bookings, today_revenue, yesterday_bookings, yesterday_revenue, weekly_revenue,
         monthly_revenue, occupancy_rate, pending_bookings, total_clients, upcoming_bookings,
         payment_summary]
      properties:
        today_bookings: {type: integer}
        today_revenue: {type: integer, description: "Centavos ARS."}
        yesterday_bookings: {type: integer}
        yesterday_revenue: {type: integer, description: "Centavos ARS."}
        weekly_revenue: {type: integer, description: "Centavos ARS."}
        monthly_revenue: {type: integer, description: "Centavos ARS."}
        occupancy_rate:
          type: integer
          description: "0 to 100. Booked minutes over active courts times today's open hours."
        pending_bookings: {type: integer}
        total_clients: {type: integer}
        upcoming_bookings:
          type: array
          description: The next 10 bookings due today.
          items: {$ref: "#/components/schemas/Booking"}
        payment_summary: {$ref: "#/components/schemas/PaymentSummary"}

    PaymentSummary:
      type: object
      required: [by_status, by_method]
      properties:
        by_status:
          type: object
          description: Collection or refund status name to its breakdown.
          additionalProperties: {$ref: "#/components/schemas/PaymentStatusBreakdown"}
        by_method:
          type: object
          description: Payment method name to count.
          additionalProperties: {type: integer}

    PaymentStatusBreakdown:
      type: object
      required: [count, total]
      properties:
        count: {type: integer}
        total: {type: integer, description: "Centavos ARS."}

    RevenueDataPoint:
      type: object
      required: [date, amount]
      properties:
        date: {type: string, format: date}
        amount: {type: integer, description: "Centavos ARS."}

    OccupancyPoint:
      type: object
      required: [day_of_week, hour, percentage]
      properties:
        day_of_week: {type: integer, minimum: 0, maximum: 6}
        hour: {type: integer, minimum: 0, maximum: 23}
        percentage: {type: integer, description: "0 to 100, capped."}

    ClientInsights:
      type: object
      required: [top, no_show_rate, no_show_count, resolved_count, new_clients_30d, recurring_30d, total_active_30d]
      properties:
        top:
          type: array
          items: {$ref: "#/components/schemas/TopClient"}
        no_show_rate: {type: integer}
        no_show_count: {type: integer}
        resolved_count:
          type: integer
          description: "JSON tag is resolved_count, the Go field is named CompletedCount."
        new_clients_30d: {type: integer}
        recurring_30d: {type: integer}
        total_active_30d: {type: integer}

    TopClient:
      type: object
      required: [id, name, phone, booking_count, total_spent]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
        booking_count: {type: integer}
        total_spent: {type: integer, description: "Centavos ARS."}

    MonthlyReport:
      type: object
      description: Built as ad-hoc nested maps in the handler, not named Go structs.
      required: [month, year, by_method, by_court, totals, previous_totals]
      properties:
        month: {type: integer, minimum: 1, maximum: 12}
        year: {type: integer}
        by_method:
          type: object
          description: Payment method name to its summary for the month.
          additionalProperties: {$ref: "#/components/schemas/MonthlyReportSummary"}
        by_court:
          type: array
          items: {$ref: "#/components/schemas/MonthlyReportCourtSummary"}
        totals: {$ref: "#/components/schemas/MonthlyReportSummary"}
        previous_totals:
          allOf:
            - {$ref: "#/components/schemas/MonthlyReportSummary"}
          description: Same shape as totals, for the prior month.

    MonthlyReportSummary:
      type: object
      required: [count, total, refunded, net]
      properties:
        count: {type: integer}
        total: {type: integer, description: "Centavos ARS."}
        service_fees: {type: integer, description: "Centavos ARS. Present on the totals/previous_totals rows."}
        refunded: {type: integer, description: "Centavos ARS."}
        net: {type: integer, description: "Centavos ARS."}

    MonthlyReportCourtSummary:
      type: object
      required: [court_id, court_name, count, total, refunded, net]
      properties:
        court_id: {type: string}
        court_name: {type: string}
        count: {type: integer}
        total: {type: integer, description: "Centavos ARS."}
        refunded: {type: integer, description: "Centavos ARS."}
        net: {type: integer, description: "Centavos ARS."}
