# DAG state for the remediation program's planning umbrella.
#
# This folder holds only the exploration that decides how the work is cut. The
# 37 changes it defines get their own folders under openspec/changes/ as each
# one is proposed.

change: money-path-remediation-program
kind: program-umbrella
created: 2026-08-20

session:
  execution_mode: auto
  artifact_store: openspec
  delivery_strategy: auto-chain
  review_budget_lines: 1200

phases:
  explore:
    status: complete
    artifact: exploration.md
    note: >
      Produced by the sdd-explore phase agent, which had no filesystem write
      capability and persisted to Engram (sdd/money-path-remediation-program/explore,
      id 21). The orchestrator materialized it into this folder. Gate verdict:
      the phase returned status=partial for that reason alone; content passed
      every other gate check.
  propose:
    status: scoped
    note: >
      Scope decided by the user: full SDD runs only on the changes carrying
      genuine design ambiguity. The other 31 are understood fixes and are
      delivered directly, grouped by phase, each with mutation-verified test
      evidence. SDD's value is reducing ambiguity; writing a proposal, spec and
      design for a decision already made is ceremony, not traceability.

# Route per change. `sdd` = full six-phase cycle. `direct` = delegated
# implementation with mutation-verified tests, no SDD artifacts.
