name: vibe

services:
  db:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vibe
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe_dev
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/<major>/docker,
      # so the volume mounts one level up or the data lands outside it.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
