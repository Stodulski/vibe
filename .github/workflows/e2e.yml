name: E2E

# The Playwright suite lives in frontend and runs against an isolated API
# built from backend, so a change to either package triggers it. Both live
# in this repository now: no cross-repository checkout, no token.
on:
  pull_request:
    # No `paths` filter on pull requests: every job of every workflow is a
    # required status check on main, and a required check that never runs
    # (because the PR touched only the other package) blocks the merge forever.
    # `push.branches: [main]` keeps its paths filter: that side only feeds
    # deploy-time signals and caches.
    branches: [main]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (make e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The published binary, pinned to the library version in go.mod: building
      # goose from source cost a minute and a half per run.
      - name: Install goose
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose" https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          echo "ab073515b78ef345f64f018c0d79aa7db50106806efc686dda7181253765ae13  $RUNNER_TEMP/goose" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/goose" /usr/local/bin/goose
          goose --version

      # The fixtures seal a fake MercadoPago credential and reset the e2e
      # database through psql.
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      - name: Install client dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # CI=1 makes playwright.config.ts run one worker with one retry and
      # refuse test.only; the runner starts the isolated API, Vite and the
      # e2e Postgres and Redis itself. `make e2e` finds the client at
      # ../frontend by default, which is exactly where it is.
      - name: E2E
        working-directory: backend
        env:
          CI: "1"
        run: make e2e

      # Uploaded on green runs too: a test that failed its first attempt and
      # passed the retry leaves its screenshot and page snapshot here, and
      # that is the only evidence a flaky test leaves behind.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/e2e-results
          retention-days: 7
