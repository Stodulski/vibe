name: Frontend

on:
  pull_request:
    # No `paths` filter on pull requests: every job of every workflow is a
    # required status check on main, and a required check that never runs
    # (because the PR touched only the other package) blocks the merge forever.
    # `push.branches: [main]` keeps its paths filter: that side only feeds
    # deploy-time signals and caches.
    #
    # The workflow still triggers on every pull request; only the heavy jobs
    # below skip when this PR cannot affect them. The `changes` job computes
    # which packages changed and every other job gets `needs: changes` plus
    # `if: github.event_name != 'pull_request' || needs.changes.outputs.<x> ==
    # 'true'`. A job skipped by a job-level `if:` still reports success to
    # required checks (unlike a workflow-level `paths` filter, which never
    # reports at all), so the required check name keeps matching and the PR
    # is never blocked waiting on it.
    branches: [main]
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs inside the client package; `uses` steps take explicit paths
# because `defaults.run` only applies to `run` steps.
defaults:
  run:
    working-directory: frontend

jobs:
  # Cheap gate for the jobs below. Every one of them still exists and still
  # triggers on every pull request (see the comment on `pull_request` above);
  # this job only decides, per PR, whether they have anything to check.
  #
  # `frontend=true` on a push (or any non-pull_request event) because the
  # workflow's own `push.paths` filter already decided this run should
  # happen at all — nothing here re-narrows it.
  #
  # On a pull_request, this diffs the PR's base against its head. `frontend`
  # is true when the diff touches `frontend/**` or
  # `backend/internal/openapi/openapi.yaml` (the generated API client is
  # regenerated from it), when it touches `.github/**` (a workflow or script
  # change can affect what these jobs do), when it touches any root-level
  # file outside backend/, frontend/, landing/ and docs/ (unclassifiable —
  # treated the same as `.github/**`), or when the base commit cannot be
  # found in the fetched history (fail open, never closed: an undetermined
  # diff must never suppress a required check).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::Base commit ${base} is not in the fetched history; running every job."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${base}" "${head}")"
          echo "Changed files:"
          echo "$files"

          frontend=false
          everything=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*) everything=true ;;
              backend/internal/openapi/openapi.yaml) frontend=true ;;
              frontend/*) frontend=true ;;
              backend/*|landing/*|docs/*) ;;
              *) everything=true ;;
            esac
          done <<< "$files"

          if [ "$everything" = "true" ]; then
            frontend=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck (tsc -b --force)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --force

  lint:
    name: Lint (eslint .)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  format:
    name: Format check (prettier --check)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TST-12: coverage is collected on every run and made visible without a
      # hard threshold: the text summary lands in the job summary and the lcov
      # report is kept as an artifact for a week.
      - name: Test
        run: NODE_OPTIONS=--max-old-space-size=3072 pnpm test:coverage 2>&1 | tee test-output.log

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' test-output.log | sed '1d;$d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  # A broken build was previously discovered only by Vercel, after merge
  # (CI-06). VITE_APP_URL is a placeholder — the real value is a Vercel
  # project env var — and SENTRY_AUTH_TOKEN is deliberately left unset so
  # the Sentry plugin stays a no-op and this job never needs Sentry
  # credentials.
  build:
    name: Build (vite build)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_APP_URL: https://app.vibe.com.ar
        run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  audit:
    name: Audit (pnpm audit)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-08/SEC-09: a high or critical npm advisory blocks the PR instead
      # of only ever surfacing through Dependabot after merge. The verdict
      # comes from the registry advisory feed, so the call is retried to ride
      # out a transient registry outage; an advisory with no fixed version is
      # waived by adding `auditConfig.ignoreCves` to frontend/pnpm-workspace.yaml
      # (with the reason in the PR that adds it), never by disabling this job.
      - name: Audit
        run: |
          for attempt in 1 2 3; do
            pnpm audit --audit-level high --prod && exit 0
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

  lighthouse:
    name: Lighthouse (lhci autorun)
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # lighthouserc.cjs points at :5173 (the same port the dev server and
      # `make e2e` use), so `vite preview` is pinned there instead of its
      # own default port. Backgrounded and left running for the job's
      # lifetime; the runner tears it down when the job ends.
      - name: Start preview server
        run: |
          pnpm exec vite preview --port 5173 --strictPort &
          timeout 60 bash -c 'until curl -sf http://localhost:5173 -o /dev/null; do sleep 1; done'

      - name: Lighthouse
        run: pnpm test:lighthouse

  knip:
    name: Knip (unused exports/deps)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip
        run: pnpm knip
