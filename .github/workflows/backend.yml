name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs inside the server package; `uses` steps take explicit paths
# because `defaults.run` only applies to `run` steps.
defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # The action installs golangci-lint and runs it, reporting findings as
      # inline annotations on the pull request. Config lives in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend

  test:
    name: Unit tests (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      # Integration and security tests are behind the `integration` build tag
      # and need a live Postgres, so they are not part of this gate. They run
      # via `make test/integration` in the job below.
      - name: Test
        run: make test

  build:
    name: Build (make build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      - name: Build
        run: make build

  audit:
    name: Audit (make audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Audit
        run: make audit

  integration:
    name: Integration tests (make test/integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      # The published binary, pinned to the library version in go.mod: building
      # goose from source cost a minute and a half per run.
      - name: Install goose
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose" https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          echo "ab073515b78ef345f64f018c0d79aa7db50106806efc686dda7181253765ae13  $RUNNER_TEMP/goose" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/goose" /usr/local/bin/goose
          goose --version

      # docker-compose.e2e.yml brings up the e2e Postgres on 5433 and Redis on
      # 6380 and migrates the database; the `integration` build tag then runs
      # against them.
      - name: Integration tests
        run: make e2e-db-up && make test/integration
