name: Backend

on:
  # No `branches` filter here (CI-01): a pull request stacked on top of
  # another feature branch — anything that isn't yet targeting `main` — still
  # needs this to run. `push.branches: [main]` is unchanged; that side only
  # ever cares about what lands on `main`.
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# BLD-05: go.sum is committed and `make audit` already runs `go mod verify`,
# but nothing forced the build itself to refuse a silent go.mod/go.sum
# rewrite. This matches the same env var set in the Dockerfile's builder
# stage.
env:
  GOFLAGS: -mod=readonly

# Every job runs inside the server package; `uses` steps take explicit paths
# because `defaults.run` only applies to `run` steps.
defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # internal/openapi/openapi.yaml is the source of truth and
      # internal/openapi/gen is committed; this regenerates it with the same
      # pinned oapi-codegen `make generate/api` always uses and refuses a
      # diff, so a document edit that never got `make generate/api` run
      # after it — or a hand-edit of the generated package itself — fails
      # here instead of shipping a mismatch between the two.
      - name: Generated API code matches the document
        run: |
          make generate/api
          git diff --exit-code internal/openapi/gen

      # The action installs golangci-lint and runs it, reporting findings as
      # inline annotations on the pull request. Config lives in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend

  format:
    name: Format and vet (gofmt, goimports, go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # Pinned to the golang.org/x/tools version already in go.sum (see
      # go.mod's `// indirect` line for it) so this installs the exact
      # `goimports` build already resolved for this module graph. Bump this
      # alongside any go.mod bump of golang.org/x/tools.
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: goimports
        run: |
          unformatted="$(goimports -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::goimports found unformatted files (or import groups):"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint's default linter set includes govet, but only over the
      # subset of vet passes it enables; this runs the full standard `go vet`
      # analyzer set explicitly, same as `go build`/`go test` already do
      # implicitly.
      - name: go vet
        run: go vet ./...

  test:
    name: Unit tests (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      # Integration and security tests are behind the `integration` build tag
      # and need a live Postgres, so they are not part of this gate. They run
      # via `make test/integration` in the job below.
      #
      # test/cover runs the same suite as test (also -race -shuffle=on) plus
      # -coverprofile, so this is strictly more than `make test` for the same
      # cost — no separate run needed to get coverage visible in CI (TST-10).
      - name: Test
        run: make test/cover

      # if: always() so a broken test still leaves the summary and artifact:
      # coverage.out is written once compilation succeeds, before `go test`
      # returns non-zero on a failing case.
      - name: Coverage summary
        if: always()
        run: |
          echo '### Unit test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'coverage.out not produced (build or test failure before coverage was written)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Build (make build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      - name: Build
        run: make build

  audit:
    name: Audit (make audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Audit
        run: make audit

  sqlc:
    name: sqlc vet (make vet/sqlc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      # Same pinned binary as the `integration` job below.
      - name: Install goose
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose" https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          echo "ab073515b78ef345f64f018c0d79aa7db50106806efc686dda7181253765ae13  $RUNNER_TEMP/goose" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/goose" /usr/local/bin/goose

      # A disposable Postgres just for db-prepare: sqlc/db-prepare (see
      # sqlc.vet.yaml) needs a real, migrated database to check every query
      # against. This reuses docker-compose.e2e.yml's `db` service only —
      # not the full e2e stack the `integration` job below brings up — and
      # nothing here needs to survive past this job.
      - name: Start Postgres
        run: docker compose -f docker-compose.e2e.yml up -d --wait db

      - name: Migrate
        run: goose -dir ./db/migrations postgres "postgres://vibe:vibe_e2e@localhost:5433/vibe_e2e?sslmode=disable" up

      - name: sqlc vet
        env:
          DATABASE_URL: postgres://vibe:vibe_e2e@localhost:5433/vibe_e2e?sslmode=disable
        run: make vet/sqlc

  container:
    name: Container build and scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: vibe-api:ci
          build-args: |
            COMMIT=${{ github.sha }}

      # HIGH/CRITICAL with known fixes fail the job (exit-code 1); a finding
      # with no upstream fix yet (ignore-unfixed) cannot be acted on by this
      # PR, so it is reported without blocking. gosec + govulncheck (audit
      # job) already cover the Go source and its module graph; this covers
      # the OS packages actually shipped in the final image.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vibe-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  integration:
    name: Integration tests (make test/integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # setup-go saves its build cache only when go.sum changes, and whichever
      # job saves it first fills it with that job's flavour of the build; the
      # objects this job needs (race-instrumented, or CGO_ENABLED=0) were never
      # in it, so every run compiled the tree from scratch. This one is keyed
      # per job and saved on every run, so the next run restores the newest.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ github.job }}-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ github.job }}-

      # The published binary, pinned to the library version in go.mod: building
      # goose from source cost a minute and a half per run.
      - name: Install goose
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose" https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64
          echo "ab073515b78ef345f64f018c0d79aa7db50106806efc686dda7181253765ae13  $RUNNER_TEMP/goose" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/goose" /usr/local/bin/goose
          goose --version

      # docker-compose.e2e.yml brings up the e2e Postgres on 5433 and Redis on
      # 6380 and migrates the database; the `integration` build tag then runs
      # against them.
      - name: Integration tests
        run: make e2e-db-up && make test/integration
