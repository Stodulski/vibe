name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs inside the server package; `uses` steps take explicit paths
# because `defaults.run` only applies to `run` steps.
defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # The action installs golangci-lint and runs it, reporting findings as
      # inline annotations on the pull request. Config lives in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: backend

  test:
    name: Unit tests (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # Integration and security tests are behind the `integration` build tag
      # and need a live Postgres, so they are not part of this gate. They run
      # via `make test/integration` in the job below.
      - name: Test
        run: make test

  build:
    name: Build (make build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: make build

  audit:
    name: Audit (make audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Audit
        run: make audit

  integration:
    name: Integration tests (make test/integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      # docker-compose.e2e.yml brings up the e2e Postgres on 5433 and Redis on
      # 6380 and migrates the database; the `integration` build tag then runs
      # against them.
      - name: Integration tests
        run: make e2e-db-up && make test/integration
