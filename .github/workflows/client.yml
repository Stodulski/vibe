name: Client

on:
  pull_request:
    branches: [main]
    paths:
      - "vibe-client/**"
      - ".github/workflows/client.yml"
  push:
    branches: [main]
    paths:
      - "vibe-client/**"
      - ".github/workflows/client.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs inside the client package; `uses` steps take explicit paths
# because `defaults.run` only applies to `run` steps.
defaults:
  run:
    working-directory: vibe-client

jobs:
  typecheck:
    name: Typecheck (tsc -b --force)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: vibe-client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: vibe-client/.nvmrc
          cache: pnpm
          cache-dependency-path: vibe-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --force

  lint:
    name: Lint (eslint .)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: vibe-client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: vibe-client/.nvmrc
          cache: pnpm
          cache-dependency-path: vibe-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  format:
    name: Format check (prettier --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: vibe-client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: vibe-client/.nvmrc
          cache: pnpm
          cache-dependency-path: vibe-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: vibe-client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: vibe-client/.nvmrc
          cache: pnpm
          cache-dependency-path: vibe-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
