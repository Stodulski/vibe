name: Packages

on:
  pull_request:
    # Same contract as frontend.yml: no `paths` filter on pull requests, because
    # every job is a required status check on main. The `changes` job decides per
    # PR whether the heavy jobs have anything to check; a skipped job still
    # reports success, so the required check names keep matching.
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/packages.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides, per pull request, whether the workspace packages changed. A push
  # already passed the workflow's own `paths` filter, so it always runs.
  #
  # `packages=true` when the diff touches `packages/**`, the lockfile or the
  # workspace file, or `.github/**` (a workflow change can affect these jobs),
  # or any root-level file outside backend/, frontend/, landing/ and docs/
  # (unclassifiable, so treated like `.github/**`). An undetermined diff fails
  # open: a base commit missing from the fetched history runs every job.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::Base commit ${base} is not in the fetched history; running every job."
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${base}" "${head}")"
          echo "Changed files:"
          echo "$files"

          packages=false
          everything=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*) everything=true ;;
              packages/*|pnpm-lock.yaml|pnpm-workspace.yaml) packages=true ;;
              backend/*|frontend/*|landing/*|docs/*) ;;
              *) everything=true ;;
            esac
          done <<< "$files"

          if [ "$everything" = "true" ]; then
            packages=true
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck packages (tsc)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./packages/*..."

      - name: Typecheck
        run: pnpm --filter "./packages/*" run typecheck

  lint:
    name: Lint packages (eslint)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./packages/*..."

      - name: Lint
        run: pnpm --filter "./packages/*" run lint

  test:
    name: Unit tests packages (vitest)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./packages/*..."

      - name: Test
        run: pnpm --filter "./packages/*" run test
