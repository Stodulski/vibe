name: Backend backup

# BLD-06: Railway does not back up its managed Postgres automatically (owner
# decision: a scheduled `pg_dump` to Cloudflare R2 replaces relying on a
# platform feature that does not exist). See backend/docs/runbook-backups.md
# for the restore procedure, retention policy and secret setup this workflow
# depends on.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: backend-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # pg_dump must be >= the server's major version (it can dump an older
      # server, never a newer one). Railway runs Postgres 18. The runner image
      # already ships an older client, and PGDG's /usr/bin/pg_dump wrapper
      # picked it over the one installed here — a run failed with "server
      # version: 18.6; pg_dump version: 16.15" — so the version is pinned by
      # calling the binary through its own absolute path below.
      - name: Install postgresql-client-18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"

      # Fails with the two versions named rather than with pg_dump's own error
      # halfway through a backup window, so an upgrade on Railway's side is
      # obvious: bump the install step above and the paths here.
      - name: Check the client can dump this server
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          client="$("${PG_BIN}/pg_dump" --version | awk '{print $3}' | cut -d. -f1)"
          server="$("${PG_BIN}/psql" "$BACKUP_DATABASE_URL" -tAc 'SHOW server_version_num')"
          server_major=$((server / 10000))
          echo "pg_dump major: ${client}; server major: ${server_major}"
          if [ "${client}" -lt "${server_major}" ]; then
            echo "::error::pg_dump ${client} cannot dump a Postgres ${server_major} server. Install postgresql-client-${server_major} in the step above."
            exit 1
          fi

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          sha="${GITHUB_SHA:0:7}"
          name="vibe-${stamp}-${sha}.dump"
          echo "DUMP_NAME=${name}" >> "$GITHUB_ENV"

          "${PG_BIN}/pg_dump" --format=custom --no-owner --no-privileges "$BACKUP_DATABASE_URL" > "$name"

          # A dump that is empty or truncated is worse than no dump: it looks
          # like a backup exists until the day it is needed. custom-format
          # dumps always carry at least the PGDMP header, so anything under a
          # few hundred bytes means pg_dump failed silently or the connection
          # dropped mid-stream.
          size="$(stat -c%s "$name")"
          if [ "$size" -lt 512 ]; then
            echo "::error::pg_dump produced a suspiciously small file (${size} bytes) — treating as failed, not uploading."
            exit 1
          fi

          gzip "$name"
          echo "DUMP_PATH=${name}.gz" >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # --quiet and no echo of the destination: the endpoint embeds the
          # R2 account id and the destination embeds the bucket name, neither
          # of which belongs in a public or shared CI log.
          aws s3 cp "$DUMP_PATH" "s3://${R2_BACKUP_BUCKET}/postgres/${DUMP_PATH}" \
            --endpoint-url "https://${R2_BACKUP_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --quiet
          echo "Uploaded $(stat -c%s "$DUMP_PATH") bytes to postgres/${DUMP_PATH##*/}"

      - name: Clean up local dump
        if: always()
        run: rm -f -- *.dump *.dump.gz
