version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        patterns:
          - "*"
        # React, its router, TanStack Query and Vite are foundational
        # dependencies the owner wants to review one at a time — excluded
        # from the group entirely (not just from majors) so a minor bump of
        # any of these never rides in on the same PR as everything else's
        # patches (CI-07).
        exclude-patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@tanstack/react-query"
          - "vite"
        update-types:
          - "minor"
          - "patch"

  # backend/go.mod, go.sum
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # backend/Dockerfile base images (golang:1.27-alpine, gcr.io/distroless/static)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Every workflow under .github/workflows/, repository-wide
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
