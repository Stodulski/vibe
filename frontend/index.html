<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Critical CSS — inline for instant first paint */
      body {
        margin: 0;
        background: #0b0b0b;
        color: #fff;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }
      #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="Vibe - Gestión de complejos deportivos, reservas y canchas" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe" />
    <meta property="og:title" content="Vibe - Reserva tu cancha" />
    <meta property="og:description" content="Reserva canchas de pádel, tenis y fútbol de forma rápida y segura." />
    <meta property="og:image" content="https://app.vibe.com.ar/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe - Reserva tu cancha" />
    <meta name="twitter:description" content="Reserva canchas de pádel, tenis y fútbol de forma rápida y segura." />
    <meta name="twitter:image" content="https://app.vibe.com.ar/logo.png" />
    <link rel="preconnect" href="https://api.vibe.com.ar" crossorigin />
    <link rel="dns-prefetch" href="https://api.vibe.com.ar" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vibe",
        "description": "Gestión de complejos deportivos y reservas de canchas",
        "url": "https://vibe.com.ar",
        "applicationCategory": "BusinessApplication"
      }
    </script>
    <title>Vibe</title>
  </head>
  <body>
    <div id="root">
      <!-- Skeleton loader — visible until React hydrates, then replaced -->
      <div
        id="app-skeleton"
        style="min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0b0b0b"
      >
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" style="animation: spin 0.8s linear infinite">
          <circle
            cx="24"
            cy="24"
            r="20"
            stroke="#22c55e"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="80 40"
          />
        </svg>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
