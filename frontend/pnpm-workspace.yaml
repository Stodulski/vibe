allowBuilds:
  '@playwright/browser-chromium': true
  '@sentry/cli': true
  esbuild: true
  msw: true
  protobufjs: true
  unix-dgram: false
minimumReleaseAgeExclude:
  - vite@8.3.0
# Transitive packages with a Dependabot alert whose direct dependants have not
# released a fix yet. csv-parse (artillery) is left alone: artillery relies on
# the v4 default export, which csv-parse 7 removed.
overrides:
  'fast-uri@3': '>=3.1.6 <4'
  'brace-expansion@2': '>=2.1.2 <3'
  'tmp@<0.2.6': '>=0.2.6 <0.3'
  '@babel/plugin-transform-modules-systemjs@7': '>=7.29.4 <8'
  'uuid@8': '>=11.1.1 <12'
